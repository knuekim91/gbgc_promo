<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f5bd8">
<title>경북여상 원서접수현황</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1f2937;--mu:#6b7280;--pr:#2f5bd8;--ok:#16a34a;--wa:#d97706;--er:#dc2626;--bd:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--pr:#7b9cff;--bd:#374151}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,'Malgun Gothic',sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:16px}
header span{color:var(--mu);font-size:13px}
header{padding:12px 16px;border-bottom:2px solid transparent;border-image:linear-gradient(90deg,#2f5bd8,#e8508a,#f5b83d,#2f5bd8) 1;box-shadow:0 4px 14px rgba(47,91,216,.15)}
header .brand{font-size:23px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;line-height:1.2}
header .brand .bt{font-size:inherit;color:transparent;background:linear-gradient(100deg,#2f5bd8 0%,#8a4fe0 30%,#e8508a 50%,#f5a623 70%,#2f5bd8 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;animation:shine 6s linear infinite}
header .gem{font-style:normal;color:#f5b83d;font-size:16px;animation:tw 2.4s ease-in-out infinite}
header .gem.g2{color:#e8508a;font-size:12px;animation-delay:1.2s}
@keyframes shine{to{background-position:-250% 0}}
@keyframes tw{0%,100%{transform:scale(.7) rotate(0);opacity:.6}50%{transform:scale(1.25) rotate(25deg);opacity:1}}
@media (prefers-reduced-motion:reduce){header .brand .bt,header .gem{animation:none}}
@media (max-width:480px){header{padding:10px 12px}header .brand{font-size:17px}header .gem{display:none}header #who{font-size:12px;white-space:nowrap}}
nav{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto}
nav button{border:0;background:transparent;color:var(--mu);padding:8px 12px;border-radius:8px;font:inherit;font-weight:600;white-space:nowrap}
nav .mlink{padding:8px 12px;border-radius:8px;font-weight:600;white-space:nowrap;color:var(--pr);text-decoration:none}
nav button.on{background:var(--pr);color:#fff}
main{padding:12px 16px 80px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--pr)}
.bar i.f{background:var(--er)}
.kv{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mu)}
.kv b{color:var(--tx)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-weight:700}
.seg button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.seg button.on.ok{background:var(--ok);border-color:var(--ok)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--pr);color:#fff;font:inherit;font-weight:700;margin-top:14px}
.btn.s{display:inline-block;width:auto;padding:7px 12px;margin:0;font-size:13px}
.btn.g{background:var(--bd);color:var(--tx)}
.btn.s:not(.g){color:#fff}   /* 카드 안의 .s(작은 글씨) 색이 버튼 글자를 덮지 않게 */
.btn.s.g{color:var(--tx)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bd)}
.tag.ok{background:#dcfce7;color:#166534}.tag.wa{background:#fef3c7;color:#92400e}.tag.er{background:#fee2e2;color:#991b1b}.tag.pr{background:#dbe5ff;color:#1e3a8a}
.row{border-top:1px solid var(--bd);padding:10px 0}
.row:first-child{border-top:0}
.row .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.row .s{font-size:13px;color:var(--mu);margin-top:3px}
a{color:var(--pr)}
.notice{background:#fef3c7;color:#78350f;border-radius:10px;padding:10px 14px;margin-bottom:12px}
.msg{position:fixed;left:16px;right:16px;bottom:16px;padding:12px 14px;border-radius:10px;background:#111827;color:#fff;z-index:9;display:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.wrap{overflow-x:auto}
.hide{display:none!important}
.login{max-width:420px;margin:7vh auto 0}
.login .brand{text-align:center;margin-bottom:22px}
.login .logo{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(135deg,var(--pr),#6d8cff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:800;box-shadow:0 8px 20px rgba(47,91,216,.28)}
.login h1{margin:0;font-size:22px;letter-spacing:-.3px}
.login .sub{margin:6px 0 0;color:var(--mu);font-size:14px}
.login .box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px 20px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.login label{margin-top:0;margin-bottom:6px;font-weight:600;color:var(--tx);font-size:13px}
.login .f{margin-bottom:16px}
.login input{padding:13px;font-size:16px}
.login .hint{margin:4px 0 0;color:var(--mu);font-size:12px}
.login .err{background:#fee2e2;color:#991b1b;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:14px}
@media (prefers-color-scheme:dark){.login .err{background:#3b1d1d;color:#fecaca}}
.login .foot{text-align:center;margin-top:16px;color:var(--mu);font-size:12px}
#busy{position:fixed;inset:0;z-index:20;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#busy .bx{background:var(--card);color:var(--tx);border-radius:14px;padding:20px 26px;display:flex;align-items:center;gap:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.spin{width:22px;height:22px;border:3px solid var(--bd);border-top-color:var(--pr);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.btn:disabled{opacity:.6}
.card.dept{cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;border-width:2px;position:relative}
.card.dept:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.card.dept:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.card.dept.sel{border-color:var(--pr);background:linear-gradient(180deg,var(--selbg),var(--card) 70%);box-shadow:0 0 0 4px var(--selring),0 10px 26px var(--selsh)}
.card.dept .pick{margin-top:8px;font-size:12px;font-weight:700;color:var(--pr)}
:root{--selbg:#e7eeff;--selring:rgba(47,91,216,.18);--selsh:rgba(47,91,216,.18)}
@media (prefers-color-scheme:dark){:root{--selbg:#25325c;--selring:rgba(123,156,255,.28);--selsh:rgba(123,156,255,.2)}}
.stbl h3{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.stbl table{width:auto;min-width:0}   /* 열 너비는 글자 수에 맞게, 표를 억지로 늘리지 않는다 */
.stbl th,.stbl td{padding:7px 12px 7px 8px}
.stbl td .btn.s{padding:5px 10px}
@media (max-width:520px){.stbl th,.stbl td{padding:6px 8px 6px 5px}.stbl td .btn.s{padding:4px 8px;font-size:12px}.stbl table{font-size:12.5px}}
.stbl th{background:var(--bg);color:var(--mu);font-size:12px;white-space:nowrap}
.stbl td{white-space:nowrap}
.stbl tr.out td{background:rgba(220,38,38,.06)}
.stbl .mut{color:var(--mu)}
.stbl .rk{font-weight:800;text-align:center}
.stbl .empty{padding:22px;text-align:center;color:var(--mu)}
.chips{display:flex;gap:6px}
.chips button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.chips button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.pchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:thin}
.pchips button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.pchips button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.pnote{font-size:12px;color:var(--mu);margin:2px 0 10px}
.pwrap{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.pwrap{grid-template-columns:minmax(0,520px) minmax(0,1fr);align-items:start}}
.pv{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.pv .scroller{overflow:auto;max-height:80vh;-webkit-overflow-scrolling:touch;text-align:center}
.pv img{display:block;width:100%;height:auto;margin:0 auto;cursor:zoom-in;user-select:none;-webkit-user-drag:none}
.pv.zoom img{width:210%;max-width:none;cursor:grab}
.pnav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:42px;height:64px;border:0;border-radius:10px;background:rgba(17,24,39,.55);color:#fff;font-size:28px;cursor:pointer}
.pnav.prev{left:6px}.pnav.next{right:6px}
.pnav:disabled{opacity:.25;cursor:default}
.pfsbar{display:none}
.perr{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;background:var(--card);color:var(--tx);cursor:pointer}
.pv:fullscreen{background:#000;border:0;border-radius:0;width:100vw;height:100vh}
.pv:fullscreen .scroller{max-height:none;height:100vh;display:flex;align-items:center;justify-content:center;overflow:auto}
.pv:fullscreen img{width:auto;height:100vh;max-width:100%;margin:auto;object-fit:contain}
.pv:fullscreen.zoom .scroller{display:block}
.pv:fullscreen.zoom img{width:100%;height:auto;max-width:none;object-fit:initial}
.pv:fullscreen .pfsbar{display:flex;position:absolute;top:0;left:0;right:0;z-index:5;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,0));color:#fff;font-size:15px;font-weight:700;pointer-events:none}
.pv:fullscreen .pfsbar button{pointer-events:auto;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.45);color:#fff;border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.pbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
.pbar .ttl{font-weight:800}
.pbar .sub{color:var(--mu);font-size:13px}
.ppts ul{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px;line-height:1.5}
.pthumbs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.pthumbs img{flex:none;width:76px;height:auto;border:2px solid var(--bd);border-radius:6px;cursor:pointer;opacity:.75}
.pthumbs img.on{border-color:var(--pr);opacity:1;box-shadow:0 0 0 3px var(--selring)}
.seg button.on.gone{background:#6b7280;border-color:#6b7280}
.card.gone{opacity:.62}
.card.dept .big{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:2px 12px}
.card.dept .n1{font-size:22px;font-weight:800}
.card.dept .n1 span{font-size:13px;color:var(--mu);font-weight:400}
.card.dept .rcv{font-size:13px;font-weight:700;color:var(--tx);white-space:nowrap}
.card.dept .rcv b{font-size:30px;line-height:1;font-weight:800;color:var(--er);margin-left:2px}
@media (prefers-color-scheme:dark){:root{--er:#f87171}}
.bdg{display:inline-block;min-width:18px;padding:0 6px;border-radius:99px;background:var(--er);color:#fff;font-size:12px;line-height:18px;text-align:center;margin-left:4px;vertical-align:1px}
nav button.on .bdg{background:#fff;color:var(--er)}
.qtop{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.qform{margin-top:6px;padding-top:2px;border-top:1px solid var(--bd)}
.qform textarea,.qd-f textarea{resize:vertical;min-height:84px}
.qfilter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.qna table{min-width:820px}
.qna td{white-space:normal;vertical-align:top}
.qna td.q{min-width:240px;max-width:340px;font-weight:600}
.qna td.a{min-width:200px;max-width:300px;color:var(--tx)}
.qna tr.qrow{cursor:pointer}
.qna tr.qrow:hover td{background:var(--bg)}
.qna tr.qrow.open td{background:var(--selbg)}
.qna tr.qdet td{background:var(--bg);padding:0}
.qd{padding:12px 14px;display:grid;gap:10px;max-width:760px}
.qd-q,.qd-a{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.qd-q>div,.qd-a>div{margin-top:4px;line-height:1.55}
.qd-a{border-left:4px solid var(--pr)}
.qd-b{display:flex;gap:8px;margin-top:8px}
.stu .qrbox{background:#fff;border-radius:16px;padding:14px;max-width:420px;margin:0 auto;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.stu .qrbox img{display:block;width:100%;height:auto}
.stu .qrurl{text-align:center;margin:12px 0;font-size:14px;word-break:break-all}
.stu .qract{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.stu .qract .btn{width:auto;margin:0;padding:12px 18px;text-decoration:none;display:inline-block}
.stuul{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14px;line-height:1.55}
a.btn{text-decoration:none;display:inline-block;width:auto}
#qrfull{position:fixed;inset:0;z-index:30;background:#fff;display:flex;align-items:center;justify-content:center;padding:16px}
#qrfull .qrfi{text-align:center;color:#111827;max-width:min(92vw,86vh)}
#qrfull img{display:block;width:min(88vw,70vh);height:auto;margin:0 auto}
#qrfull .qrft{font-size:clamp(20px,4vw,34px);font-weight:800;margin-top:10px}
#qrfull .qrfu{font-size:clamp(13px,2.4vw,20px);color:#4b5563;margin:4px 0 14px;word-break:break-all}
.tag.pub{background:#dbe5ff;color:#1e3a8a}
.stbl tr.grp td{background:var(--prbg);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--bd)}
.grph{margin:12px 2px 6px;padding:6px 12px;border-radius:8px;background:var(--prbg);font-weight:700;font-size:14px}
.grph .mut,.stbl tr.grp .mut{font-weight:400;color:var(--mu)}
/* QnA: 중학생용 페이지의 질문과 답변과 같은 모양 */
details.qa{border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;background:var(--card)}
details.qa summary{cursor:pointer;padding:13px 14px;list-style:none;display:flex;gap:10px;align-items:flex-start}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::before{content:'Q';flex:none;width:24px;height:24px;border-radius:50%;background:var(--pr);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
details.qa[open] summary{border-bottom:1px solid var(--bd)}
.qsum{flex:1;min-width:0;display:flex;gap:6px 10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.qtxt{font-weight:700;flex:1 1 220px;min-width:0;word-break:break-word}
.qbd{display:flex;gap:6px;flex:none}
.qbody{padding:12px 14px 14px 48px}
.qmeta{font-size:12px;color:var(--mu);margin-bottom:8px}
.qans{border-left:4px solid var(--pr);background:var(--bg);border-radius:8px;padding:9px 12px;margin-bottom:8px;line-height:1.55}
.qans.none{border-left-color:var(--bd);color:var(--mu)}
.qah{font-size:13px;margin-bottom:3px}
.qah span{color:var(--mu);font-size:12px;margin:0 4px}
.qempty{padding:20px;text-align:center;color:var(--mu)}
/* 원서접수 묶음 제목: 크고 진하게, 접수 완료는 초록, 접수 전은 주황 */
:root{--gokbg:#dcfce7;--gokfg:#166534;--gwtbg:#fef3c7;--gwtfg:#92400e}
@media (prefers-color-scheme:dark){:root{--gokbg:#14532d;--gokfg:#bbf7d0;--gwtbg:#4a3513;--gwtfg:#fde68a}}
.stbl tr.grp td{font-size:15px;font-weight:800;padding:9px 10px;border-bottom:0;letter-spacing:-.2px}
.stbl tr.grp.ok td{background:var(--gokbg);color:var(--gokfg);border-left:5px solid var(--ok)}
.stbl tr.grp.wait td{background:var(--gwtbg);color:var(--gwtfg);border-left:5px solid var(--wa)}
.stbl tr.grp b{font-size:20px;font-weight:800;margin:0 2px}
.grph{margin:14px 2px 8px;padding:9px 14px;border-radius:10px;font-weight:800;font-size:15px}
.grph.ok{background:var(--gokbg);color:var(--gokfg);border-left:5px solid var(--ok)}
.grph.wait{background:var(--gwtbg);color:var(--gwtfg);border-left:5px solid var(--wa)}
.grph b{font-size:20px;font-weight:800;margin:0 2px}
.grph .mut,.stbl tr.grp .mut{font-weight:600;color:inherit;opacity:.7;font-size:12px}
/* 입력 화면 단계 버튼: 너무 길지 않게 */
#stg{gap:8px;flex-wrap:wrap}
#stg button{flex:0 0 auto;min-width:92px;padding:10px 22px}
:root{--ac:#e8508a}
@media (prefers-color-scheme:dark){:root{--ac:#f472b6}}
.gut td,.gut th,.bandt td,.bandt th{text-align:right}
.gut td:first-child,.gut th:first-child,.bandt td:first-child,.bandt th:first-child{text-align:left}
.gut tr.grow{cursor:pointer}
.gut tr.grow:hover td{background:var(--bg)}
.gut tr.grow.open td{background:var(--selbg)}
.gut tr.sub td{color:var(--mu);font-size:12.5px;background:var(--bg)}
.gut .caret{color:var(--mu);font-size:12px}
.gut td.nb{position:relative;min-width:84px}
.gut td.nb .bar{position:absolute;left:0;top:6px;bottom:6px;background:var(--prbg);border-radius:4px;z-index:0}
.gut td.nb b{position:relative;z-index:1}
td.acc{color:var(--ok);font-weight:800}
.stbl tfoot td{font-weight:800;background:var(--bg);border-top:2px solid var(--bd)}
.legend{display:flex;gap:16px;margin:10px 2px 0;font-size:13px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg.chart{display:block;width:100%;height:auto;margin-top:6px}
svg.chart .grid{stroke:var(--bd);stroke-width:1}
svg.chart .ax{fill:var(--mu);font-size:12px}
svg.chart .lb{font-size:13px;fill:var(--tx);font-weight:700}
svg.chart .val{fill:var(--tx);font-size:12px;font-weight:700}
.bt{background:var(--pr);fill:var(--pr)}
.bg{background:var(--ac);fill:var(--ac)}
@media (max-width:520px){.gut th:nth-child(2),.gut td:nth-child(2){display:none}}
#ver{text-align:center;color:var(--mu);font-size:11px;padding:0 0 20px}
#upd{position:fixed;left:12px;right:12px;bottom:12px;z-index:25;background:#111827;color:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#upd button{border:0;border-radius:8px;background:#7b9cff;color:#0e1626;font:inherit;font-weight:700;padding:8px 14px;cursor:pointer}
#upd.hide{display:none!important}
#pchips{flex-wrap:wrap;overflow:visible;padding-bottom:4px}
#pchips button{padding:7px 12px;font-size:13.5px}
#ddbar{max-width:1100px;margin:10px auto 0;padding:0 16px}
#ddbar .ddin{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;background:linear-gradient(135deg,#2f5bd8,#6d8cff);color:#fff;border-radius:12px;padding:10px 16px}
#ddbar .ddl{font-weight:700;font-size:14px}
#ddbar .ddo{background:#fff;color:#2f5bd8;border-radius:99px;padding:1px 8px;font-size:12px;margin-left:6px}
#ddbar .ddn{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.5px}
#ddbar .ddn.hot{color:#ffe08a}
#ddbar .ddt{font-size:12px;opacity:.9}
#ddbar.hide{display:none!important}
.n2{font-size:11px;line-height:1.3;color:var(--mu);font-weight:400;max-width:130px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;margin-top:2px}
.n2.nm{color:var(--tx);font-size:12px;max-width:200px}
td.nt{min-width:110px}
#f_고민내용::placeholder{color:var(--mu);opacity:.45}

/* ===== 움직임 (2026-10-15.5) ===== */
:root{--fresh:#fff5d6;--freshbd:#f5b83d;--glow:rgba(245,184,61,.55);--glow2:rgba(232,80,138,.45)}
@media (prefers-color-scheme:dark){:root{--fresh:#3d3216;--glow:rgba(245,184,61,.45);--glow2:rgba(244,114,182,.4)}}
/* 디데이 배너: 색이 천천히 흐르고 빛이 가끔 스침 */
#ddbar .ddin{position:relative;overflow:hidden;background:linear-gradient(120deg,#2f5bd8,#5a6ff0,#6d8cff,#4b63e6,#2f5bd8);background-size:300% 100%;animation:ddDrift 14s ease-in-out infinite}
#ddbar .ddin::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-120%);animation:ddSheen 7s ease-in-out 1.2s infinite}
@keyframes ddDrift{50%{background-position:100% 0}}
@keyframes ddSheen{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
/* 계열 카드: 처음 볼 때 차례로 등장, 숫자는 올라가고 막대는 채워짐 */
.card.dept{isolation:isolate}
.card.dept.intro{animation:deptRise .55s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i,0) * 90ms)}
@keyframes deptRise{from{transform:translateY(12px);opacity:.35}}
.card.dept .bar{position:relative;height:9px;border-radius:5px}
.card.dept .bar i{transition:width 1.1s cubic-bezier(.2,.8,.2,1);border-radius:5px;background:linear-gradient(90deg,var(--pr),#6d8cff)}
.card.dept .bar i.f{background:repeating-linear-gradient(-45deg,#dc2626 0 10px,#ef4444 10px 20px);background-size:28px 100%;animation:barStripe 1.2s linear infinite}
@keyframes barStripe{to{background-position:28px 0}}
.card.dept .tag.er{animation:overBreathe 2.2s ease-in-out infinite}
@keyframes overBreathe{50%{box-shadow:0 0 0 4px rgba(220,38,38,.16)}}
.cnum{display:inline-block;font-variant-numeric:tabular-nums}
.card.dept .n1 span.cnum{font-size:inherit;color:inherit;font-weight:inherit}
.cnum.bump{animation:cBump .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes cBump{30%{transform:scale(1.35);color:var(--freshbd)}}
.card.dept .pick i{display:inline-block;font-style:normal;animation:pkNudge 1.6s ease-in-out infinite}
@keyframes pkNudge{50%{transform:translateY(3px)}}
/* 실시간 소식 줄 */
.live{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;min-height:42px;margin-bottom:12px}
.live .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--ok);animation:livePing 2s ease-out infinite}
.live .lb{flex:none;font-size:12px;font-weight:800;color:var(--ok)}
.live .feed{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.live .ev{flex:none;display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--bg);color:var(--mu);white-space:nowrap}
.live .ev b{color:var(--tx)}
.live .ev.hot{background:var(--fresh);color:var(--tx);box-shadow:0 0 0 1px var(--freshbd) inset}
.live .ev.new{animation:evIn .5s cubic-bezier(.2,1.4,.4,1) both}
.live .ago{font-size:11px;color:var(--mu);font-variant-numeric:tabular-nums}
.live .none{font-size:13px;color:var(--mu)}
@keyframes livePing{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%,100%{box-shadow:0 0 0 8px rgba(22,163,74,0)}}
@keyframes evIn{from{transform:translateY(10px) scale(.9);opacity:.3}}
/* 다른 전형·현황 탭에 변화가 있으면 금색 점 */
.seg button{position:relative}
.fdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--freshbd);margin-left:6px;vertical-align:1px;animation:dotPing 1.4s ease-out infinite}
@keyframes dotPing{0%{box-shadow:0 0 0 0 var(--glow)}70%,100%{box-shadow:0 0 0 8px rgba(245,184,61,0)}}
/* ★ 당일: 카드 테두리에 빛이 돌고, 처음 3초는 크게 깜빡인 뒤 은은하게 남음 */
@property --fa{syntax:'<angle>';inherits:false;initial-value:0deg}
.card.dept.fresh{border-color:transparent}
.card.dept.fresh::before{content:'';position:absolute;inset:-2px;z-index:-1;border-radius:12px;padding:2px;pointer-events:none;
  background:conic-gradient(from var(--fa),#f5b83d,#e8508a,#2f5bd8,#f5b83d);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:fSpin 2.2s linear infinite}
.card.dept.fresh::after{content:'';position:absolute;inset:-2px;z-index:-2;border-radius:12px;pointer-events:none;
  animation:fFlash .8s ease-in-out 4 var(--el,0s) both,fGlow 2.4s ease-in-out infinite calc(var(--el,0s) + 3.2s)}
@keyframes fSpin{to{--fa:360deg}}
@keyframes fFlash{0%,100%{box-shadow:0 0 0 0 var(--glow)}50%{box-shadow:0 0 22px 6px var(--glow),0 0 40px 10px var(--glow2)}}
@keyframes fGlow{0%,100%{box-shadow:0 0 8px 1px var(--glow)}50%{box-shadow:0 0 16px 3px var(--glow)}}
.nw{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:800;color:#3b2a00;background:linear-gradient(90deg,#ffd66b,#f5b83d);margin-left:4px;vertical-align:1px;white-space:nowrap;animation:nwPop .55s cubic-bezier(.2,1.6,.4,1) both var(--el,0s)}
.nw.cf{color:#fff;background:linear-gradient(90deg,#22c55e,#16a34a)}
@keyframes nwPop{from{transform:scale(.3);opacity:0}}
.burst{position:absolute;left:50%;top:40%;width:0;height:0;pointer-events:none;z-index:3}
.burst span{position:absolute;width:7px;height:7px;border-radius:2px;background:var(--c);opacity:0;animation:spark .9s cubic-bezier(.1,.8,.3,1) both}
@keyframes spark{0%{opacity:1;transform:rotate(var(--r)) translateX(0)}100%{opacity:0;transform:rotate(var(--r)) translateX(var(--d)) scale(.4)}}
/* ★ 당일 학생 줄·카드: 금색으로 깜빡이고 남은 시간 막대가 줄어듦 */
.stbl tr.fresh td{background:var(--fresh);animation:rowFlash .8s ease-in-out 4 var(--el,0s) both}
.stbl tr.fresh td:first-child{box-shadow:inset 4px 0 0 var(--freshbd)}
@keyframes rowFlash{50%{background:rgba(245,184,61,.55)}}
.card.fresh:not(.dept){background:var(--fresh);box-shadow:0 0 0 2px var(--freshbd);animation:cardFlash .8s ease-in-out 4 var(--el,0s) both}
@keyframes cardFlash{50%{box-shadow:0 0 0 2px var(--freshbd),0 0 18px 4px var(--glow)}}
.fleft{display:block;height:3px;border-radius:2px;background:var(--freshbd);margin-top:3px;max-width:120px;transform-origin:left;animation:fShrink 86400s linear both var(--el,0s)}
@keyframes fShrink{to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){
  #ddbar .ddin,#ddbar .ddin::after,.card.dept.intro,.card.dept .bar i.f,.card.dept .tag.er,.cnum.bump,.card.dept .pick i,.live .dot,.live .ev.new,.fdot,.card.dept.fresh::before,.card.dept.fresh::after,.nw,.burst,.stbl tr.fresh td,.card.fresh:not(.dept){animation:none!important}
  .card.dept .bar i{transition:none}
  .card.dept.fresh::before{background:var(--freshbd)}
  .burst,.fleft{display:none}
}
.live .feed{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 96%,transparent)}
.live .trk{display:flex;gap:8px;width:max-content}
.live .feed:hover .trk,.live .feed:active .trk{animation-play-state:paused!important}
@keyframes liveRun{from{transform:translateX(0)}to{transform:translateX(var(--mw))}}

.live .ev[role=button]{cursor:pointer}
.live .ev[role=button]:hover{filter:brightness(.96);transform:translateY(-1px)}
#smodal{position:fixed;inset:0;z-index:30;background:rgba(17,24,39,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#smodal .sbox{position:relative;width:100%;max-width:460px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:16px;padding:16px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
#smodal .sh{font-weight:800;margin:0 36px 10px 2px}
#smodal .sx{position:absolute;right:10px;top:10px;width:32px;height:32px;border:0;border-radius:50%;background:var(--bd);color:var(--tx);font:inherit;font-size:15px;cursor:pointer}

/* 홍보자료 센터 */
.pback{border:1px solid var(--bd);background:var(--card);color:var(--pr);border-radius:99px;padding:6px 14px;font:inherit;font-weight:700;font-size:13.5px;margin:0 0 10px;cursor:pointer}
.hub{position:relative;isolation:isolate;border-radius:22px;padding:28px 18px 26px;overflow:hidden;background:linear-gradient(160deg,#0f1b4d 0%,#26125f 55%,#4a1566 100%);color:#fff}
.hub-bg{position:absolute;inset:0;z-index:-1;overflow:hidden}
.hub-bg b{position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(70px);opacity:.55;animation:aur 14s ease-in-out infinite}
.hub-bg b:nth-child(1){background:#2f5bd8;left:-80px;top:-60px}
.hub-bg b:nth-child(2){background:#e8508a;right:-90px;top:20%;animation-delay:-5s}
.hub-bg b:nth-child(3){background:#f5b83d;left:35%;bottom:-160px;opacity:.35;animation-delay:-9s}
.hub-bg i{position:absolute;width:var(--sz);height:var(--sz);border-radius:50%;background:#fff;opacity:0;animation:twk 4.5s ease-in-out infinite}
@keyframes aur{50%{transform:translate(60px,40px) scale(1.2)}}
@keyframes twk{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.9;transform:scale(1.2)}}
.hub-h{text-align:center;margin-bottom:22px}
.hub-k{font-size:12px;letter-spacing:.35em;color:#c7d2ff;opacity:.9}
.hub-h h2{margin:6px 0 4px;font-size:34px;letter-spacing:-1px;background:linear-gradient(100deg,#fff 0%,#ffd66b 30%,#ff8fc0 55%,#9db8ff 80%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.hub-h p{margin:0;color:#dbe2ff}
.hub-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.hc{position:relative;text-align:left;border:0;border-radius:20px;padding:22px 20px 18px;color:#fff;font:inherit;cursor:pointer;min-height:230px;display:flex;flex-direction:column;gap:8px;overflow:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.22);
  transition:transform .25s ease,box-shadow .25s;animation:hcIn .7s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i) * 120ms);--mx:50%;--my:30%}
.hc:hover{box-shadow:0 18px 44px rgba(0,0,0,.45),0 0 0 2px var(--c2),0 0 36px -4px var(--c1)}
.hc:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hc-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(255,255,255,.28),transparent 60%)}
.hc.ready::before{content:'';position:absolute;inset:0;border-radius:20px;padding:2px;pointer-events:none;background:conic-gradient(from var(--fa),var(--c1),#ffd66b,var(--c2),#e8508a,var(--c1));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:fSpin 3.2s linear infinite}
.hc-ico{width:68px;height:68px;border-radius:18px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 8px 22px -4px var(--c1);animation:flt 3.6s ease-in-out infinite}
.hc.soon .hc-ico{filter:saturate(.8)}
.hc-t{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:6px}
.hc-d{font-size:14px;line-height:1.5;color:#e4e9ff;flex:1}
.hc-tag{position:absolute;right:14px;top:14px;border-radius:99px;padding:3px 11px;font-size:12px;font-weight:800;background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.hc.ready .hc-tag{background:linear-gradient(90deg,#ffd66b,#f5b83d);color:#3b2a00;box-shadow:none}
.hc-go{font-weight:800;font-size:15px;color:#fff;opacity:.95;transition:transform .2s}
.hc.ready:hover .hc-go{transform:translateX(4px)}
.hc.hz{padding-bottom:46px}
.hc.hz::after{content:'';position:absolute;left:-10%;right:-10%;bottom:8px;height:18px;transform:rotate(-2deg);background:repeating-linear-gradient(-45deg,#fbbf24 0 14px,#1f2937 14px 28px);opacity:.9;box-shadow:0 2px 8px rgba(0,0,0,.4);animation:tape 1.6s linear infinite;background-size:40px 40px}
.hc.shake{animation:shk .45s ease}
@keyframes hcIn{from{opacity:0;transform:translateY(28px) scale(.94)}}
@keyframes flt{50%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes tape{to{background-position:40px 0}}
@keyframes shk{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.hub-bg b,.hub-bg i,.hub-h h2,.hc,.hc.ready::before,.hc-ico,.hc.hz::after{animation:none}.hub-bg i{opacity:.5}}

/* 책장이 넘어가는 책 아이콘 */

@keyframes bkflip{0%{transform:rotateY(0);opacity:1}38%{transform:rotateY(-180deg);opacity:1}72%{transform:rotateY(-180deg);opacity:1}80%{transform:rotateY(-180deg);opacity:0}81%{transform:rotateY(0);opacity:0}90%{transform:rotateY(0);opacity:1}100%{transform:rotateY(0);opacity:1}}

<body>
<header><b class="brand"><i class="gem">✦</i><span class="bt">경북여상 원서접수현황</span><i class="gem g2">✦</i></b><span id="who"></span></header>
<nav id="nav"></nav>
<div id="ddbar" class="hide"></div>
<main id="main">불러오는 중…</main>
<div class="msg" id="msg"></div>
<div id="upd" class="hide"><span>새 버전이 나왔어요.</span> <button type="button" onclick="location.href=location.pathname+'?r='+Date.now()">지금 새로고침</button></div>
<div id="ver"></div>
<div id="busy" class="hide" role="status" aria-live="polite"><div class="bx"><span class="spin"></span><span id="busyt">처리 중…</span></div></div>

<script>
var CODE = { n: '', c: '' };   // 이름 + 접속코드 (이 폰에만 저장)
try { CODE = JSON.parse(localStorage.getItem('hb_cred') || '') || CODE; } catch (e) {}
var SELDEPT = '상업정보', VIEW2 = false, PSEC = 0, PIDX = 0;
var D = null, TAB = 'home', TRK = '취업희망자', FILTER = '', SEL = {}, EDIT = null;
var TRACKS = ['취업희망자', '일반(특별포함)'], DEPTS = ['상업정보', '보건행정코디', '3D융합콘텐츠'];
var ADJ = ['접수', '미접수'];
var FORM = {};

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function busy(t) { $('busyt').textContent = t || '처리 중…'; $('busy').classList.remove('hide'); }
function idle() { $('busy').classList.add('hide'); }
function toast(t) { var m = $('msg'); m.textContent = t; m.style.display = 'block'; setTimeout(function () { m.style.display = 'none'; }, 2600); }
function call(fn) {
  var args = [].slice.call(arguments, 1);
  var url = (window.PROMO_CONFIG || {}).apiUrl || '';
  if (url.indexOf('https://script.google.com/') !== 0 || url.slice(-5) !== '/exec') return Promise.reject(new Error('config.js 의 apiUrl 에 웹앱 주소(/exec)를 넣어야 합니다.'));
  return fetch(url, { method: 'POST', body: JSON.stringify({ fn: fn, cred: CODE, args: args }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error); return j.data; });
}
function tel(n) { n = String(n || '').trim(); return n ? '<a href="tel:' + esc(n.replace(/[^0-9+]/g, '')) + '">' + esc(n) + '</a>' : '-'; }
function adjTag(a) { return a === '접수' ? '<span class="tag ok">접수</span>' : ''; }

function load(soft) {
  if (!CODE.n || !CODE.c) { if (!soft) loginView(''); return Promise.resolve(); }
  return call('getData').then(function (d) {
    ingest(d.rows || []);
    if (soft) { softApply(d); return; }
    if (TAB === 'form' && $('f_이름')) readForm();   // 입력 중인 내용 보존
    D = d; render();
  }).catch(function (e) {
    if (soft) return;   // 자동 새로고침 실패는 조용히 넘기고 다음 차례에 다시 시도
    if (String(e.message || e).indexOf('NOAUTH') >= 0) loginView('이름 또는 접속코드가 맞지 않습니다.');
    else $('main').innerHTML = '<div class="card">오류: ' + esc(e.message || e) + '</div>';
  });
}
function loginView(err) {
  $('nav').innerHTML = ''; $('who').textContent = '';
  document.querySelector('header').classList.add('hide');
  if ($('ddbar')) $('ddbar').classList.add('hide');
  $('main').innerHTML = '<div class="login"><div class="brand"><div class="logo">원</div><h1>경북여상 원서접수현황</h1>' +
    '<p class="sub">경북여상 · 중학교 홍보 교사용</p></div>' +
    '<form class="box" id="lf" autocomplete="off">' +
    (err ? '<div class="err">' + esc(err) + '</div>' : '') +
    '<div class="f"><label for="ln">이름</label><input id="ln" placeholder="예: 홍길동" value="' + esc(CODE.n) + '" enterkeyhint="next"></div>' +
    '<div class="f"><label for="lc">접속코드</label><input id="lc" type="password" inputmode="numeric" placeholder="숫자 6자리" enterkeyhint="go">' +
    '<p class="hint">교사: 교무실에서 안내받은 코드 · 관리자: 관리자 코드</p></div>' +
    '<button class="btn" type="submit" style="margin-top:6px">확인</button></form>' +
    '<p class="foot">처음 한 번만 입력하면 이 기기에 저장됩니다.</p></div>';
  $('lf').onsubmit = function (e) { e.preventDefault(); doLogin(); };
  $('ln').onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); if ($('ln').value.trim()) $('lc').focus(); } };
  ($('ln').value ? $('lc') : $('ln')).focus();
}
function doLogin() {
  var n = $('ln').value.replace(/\s+/g, ''), c = $('lc').value.trim();
  if (!n || !c) return toast('이름과 접속코드를 입력하세요.');
  CODE = { n: n, c: c };
  try { localStorage.setItem('hb_cred', JSON.stringify(CODE)); } catch (e) {}
  busy('확인 중입니다…');
  load().then(idle, idle);
}
function logout() { CODE = { n: CODE.n, c: '' }; try { localStorage.removeItem('hb_cred'); } catch (e) {} D = null; QNA = null; QOPEN = ''; loginView(''); }


/* ---- 뒤로가기로 앱을 실수로 떠나지 않게: 뒤로가기는 앱 안에서 한 단계 되돌아가고, 첫 화면에서는 두 번 눌러야 나간다 ---- */
var BACKG = false, BACK_AT = 0;
function installBackGuard() {
  if (BACKG) return; BACKG = true;
  try {
    history.replaceState({ g: 0 }, '');
    history.pushState({ g: 1 }, '');
    window.addEventListener('popstate', onBack);
    window.addEventListener('beforeunload', function (e) {   // 입력 중인 내용이 있을 때만 새로고침·닫기 확인
      var f = $('f_이름'); if (TAB === 'form' && f && (f.value || ($('f_중학교') || {}).value)) { e.preventDefault(); e.returnValue = ''; }
    });
  } catch (err) {}
}
function onBack() {
  if (!D) { history.back(); return; }   // 로그인 전에는 그대로
  var now = Date.now();
  if ($('smodal')) { closeStu(); history.pushState({ g: 1 }, ''); return; }
  if (document.fullscreenElement) { document.exitFullscreen(); history.pushState({ g: 1 }, ''); return; }
  if (TAB === 'promo' && PMODE !== 'hub') { PMODE = 'hub'; render(); history.pushState({ g: 1 }, ''); return; }
  if (TAB !== 'home') { TAB = 'home'; render(); window.scrollTo(0, 0); history.pushState({ g: 1 }, ''); return; }
  if (now - BACK_AT < 2500) { history.back(); return; }   // 2.5초 안에 한 번 더 누르면 나감
  BACK_AT = now; toast('한 번 더 뒤로가기를 누르면 나갑니다.');
  history.pushState({ g: 1 }, '');
}
function render() {
  document.querySelector('header').classList.remove('hide');
  installBackGuard();
  ddBar();
  var r = D.me.role;
  $('who').innerHTML = esc(D.me.name) + ' · ' + r + ' <a href="#" onclick="logout();return false">다른 이름</a>';
  var tabs = [['home', '홈'], ['status', '현황']];
  if (r !== '열람') tabs.push(['form', '입력'], ['list', r === '관리자' ? '전체 관리' : '학생 목록']);
  tabs.push(['promo', '홍보자료'], ['qna', 'QnA' + qnaBadge()], ['stat', '통계'], ['stu', '중학생용']);
  $('nav').innerHTML = tabs.map(function (t) { return '<button class="' + (TAB === t[0] ? 'on' : '') + '" onclick="TAB=\'' + t[0] + '\';render()">' + t[1] + (t[0] === 'status' && TAB !== 'status' && anyFresh() ? '<span class="fdot" title="오늘 새 입력·확정"></span>' : '') + '</button>'; }).join('') + '<a class="mlink" href="manual/" target="_blank" rel="noopener">이용안내</a>';
  if (TAB === 'promo' && LASTTAB !== 'promo') PMODE = 'hub';
  LASTTAB = TAB;
  if (TAB !== 'status') STAT_KEY = '';   // 현황에 다시 들어오면 카드 등장 효과를 한 번 더
  document.body.classList.toggle('onhome', TAB === 'home');
  if (TAB === 'home') { $('main').innerHTML = viewHome(); bindHome(); }
  else if (TAB === 'status') { $('main').innerHTML = viewStatus(); animStatus(); }
  else if (TAB === 'form') { $('main').innerHTML = viewForm(); bindForm(); }
  else if (TAB === 'promo') { if (PMODE === 'hub') { $('main').innerHTML = viewHub(); bindHub(); } else if (PMODE === 'poster') { $('main').innerHTML = viewPosters(); } else { $('main').innerHTML = viewPromo(); bindPromo(); } }
  else if (TAB === 'stat') { $('main').innerHTML = viewStat(); }
  else if (TAB === 'stu') { $('main').innerHTML = viewStu(); bindStu(); }
  else if (TAB === 'qna') { $('main').innerHTML = viewQna(); bindQna(); if (!QNA) loadQna(); }
  else $('main').innerHTML = viewList();
}

/* ---- 현황 ---- */
function viewStatus() {
  var h = liveHtml();
  var key = 'status|' + TRK, intro = STAT_KEY !== key; STAT_KEY = key;
  h += '<div class="seg" style="margin-bottom:12px">' + TRACKS.map(function (t) {
    return '<button class="' + (TRK === t ? 'on' : '') + '" onclick="TRK=\'' + t + '\';render()">' + t + (t !== TRK && anyFresh(t) ? '<span class="fdot" title="오늘 새 입력·확정"></span>' : '') + '</button>'; }).join('') + '</div><div class="grid">';
  D.summary.filter(function (s) { return s.전형 === TRK; }).forEach(function (s, si) {
    var pct = s.정원 ? Math.min(100, Math.round(s.합계 / s.정원 * 100)) : 0, over = s.합계 > s.정원;
    var fz = deptFresh(s.전형, s.계열), ck = s.전형 + '|' + s.계열;
    var badge = fz ? (fz.add ? '<span class="nw" style="' + elVar(fz.el) + '">+' + fz.add + ' 신규</span>' : '') + (fz.cf ? '<span class="nw cf" style="' + elVar(fz.el) + '">확정 +' + fz.cf + '</span>' : '') + (fz.rc ? '<span class="nw cf" style="' + elVar(fz.el) + '">접수 +' + fz.rc + '</span>' : '') : '';
    function num(k, v) { return '<span class="cnum" data-k="' + ck + '|' + k + '" data-v="' + v + '">' + (CSHOWN[ck + '|' + k] == null ? v : CSHOWN[ck + '|' + k]) + '</span>'; }
    var w0 = BARW[ck] == null ? (intro ? 0 : pct) : (intro ? 0 : BARW[ck]);
    h += '<div class="card dept' + (SELDEPT === s.계열 ? ' sel' : '') + (intro ? ' intro' : '') + (fz ? ' fresh' : '') + '" style="--i:' + si + ';' + (fz ? elVar(fz.el) : '') + '" tabindex="0" role="button" aria-pressed="' + (SELDEPT === s.계열) + '" onclick="pickDept(\'' + s.계열 + '\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();pickDept(\'' + s.계열 + '\')}"><h3>' + s.계열 + ' <span class="tag ' + (over ? 'er' : 'pr') + '">' + (over ? '정원 초과' : '정원 ' + s.정원) + '</span>' + badge + '</h3>' +
      '<div class="big"><div class="n1">' + num('h', s.합계) + ' <span>/ ' + s.정원 + '명 (1지망)</span></div>' +
      '<div class="rcv">원서접수 : <b>' + num('r', s.접수 || 0) + '</b></div></div>' +
      '<div class="bar"><i class="' + (over ? 'f' : '') + '" data-ck="' + ck + '" data-w="' + pct + '" style="width:' + w0 + '%"></i></div>' +
      '<div class="kv"><span>확정 <b>' + num('c', s.확정) + '</b></span><span>고민 <b>' + num('g', s.고민) + '</b></span>' + (s.타교지원 ? '<span>타교지원 <b>' + s.타교지원 + '</b></span>' : '') + (s.전형 === '취업희망자' ? '' : '<span>2지망 <b>' + s.이지망 + '</b></span>') + '</div>' +
      (SELDEPT === s.계열 ? '<div class="pick"><i>▼</i> 아래에 지원 학생 목록</div>' : '') +
      (fz && fz.el < 1200 ? '<div class="burst">' + sparks() + '</div>' : '') + '</div>';
  });
  return h + '</div>' + statusTable() + '<p style="color:var(--mu);font-size:12px">1지망 기준 · 타교지원 제외 · 순위는 접수 완료/접수 전을 따로 내신(석차백분율)이 낮은 순으로 매김</p>';
}
function pickDept(d) { SELDEPT = d; render(); }
function statusTable() {
  var sum = D.summary.filter(function (x) { return x.전형 === TRK && x.계열 === SELDEPT; })[0] || { 정원: 0 };
  if (D.me.role === '열람') return '<div class="card stbl"><div class="empty">열람 권한은 학생 목록을 볼 수 없습니다.</div></div>';
  var all = D.rows.filter(function (r) { return r.전형 === TRK; });
  var n1 = all.filter(function (r) { return r['1지망'] === SELDEPT; }).length;
  var one = TRK === '취업희망자';   // 취업희망자 전형은 1개 계열만 지원 가능: 2지망 없음
  if (one) VIEW2 = false;
  var n2 = all.filter(function (r) { return r['2지망'] === SELDEPT; }).length;
  var rows = all.filter(function (r) { return r[VIEW2 ? '2지망' : '1지망'] === SELDEPT; }).sort(function (a, b) {
    var ga = isAcc(a) ? 0 : 1, gb = isAcc(b) ? 0 : 1;
    if (ga !== gb) return ga - gb;   // 접수 완료 먼저
    var x = a.순위 === '' ? 9999 : a.순위, y = b.순위 === '' ? 9999 : b.순위;
    if (x !== y) return x - y;
    var p = a.내신 === '' || a.내신 == null ? 9999 : Number(a.내신), q = b.내신 === '' || b.내신 == null ? 9999 : Number(b.내신);
    return p - q;
  });
  var h = '<div class="card stbl"><h3><span>' + esc(TRK) + ' · ' + esc(SELDEPT) + ' 지원 학생 <span class="tag pr">' + rows.length + '명</span></span>' +
(one ? '' : '<span class="chips"><button class="' + (VIEW2 ? '' : 'on') + '" onclick="VIEW2=false;render()">1지망 ' + n1 + '</button>' +
    '<button class="' + (VIEW2 ? 'on' : '') + '" onclick="VIEW2=true;render()">2지망 ' + n2 + '</button></span>') + '</h3>';
  if (!rows.length) return h + '<div class="empty">아직 지원한 학생이 없습니다.</div></div>';
  h += '<div class="wrap"><table><thead><tr><th>순위</th><th>이름</th><th>중학교</th><th>내신</th>' + (one ? '' : '<th>' + (VIEW2 ? '1지망' : '2지망') + '</th>') + '<th>단계</th><th>원서접수</th><th>담당교사</th><th>학생 연락처</th><th>담임</th><th>유의사항</th></tr></thead><tbody>';
  var accN = rows.filter(isAcc).length, ncol = (h.match(/<th>/g) || []).length;

var DL = [
  { name: '취업희망자 전형', open: new Date(2026, 10, 25, 9, 0), close: new Date(2026, 10, 26, 17, 0), range: '11월 25일(수)~26일(목) 09:00~17:00', closeText: '11월 26일(목) 17:00' },

function deadline(now) {
  now = now || new Date();
  for (var i = 0; i < DL.length; i++) {
    if (now <= DL[i].close) {
      var c = DL[i].close, d = Math.round((new Date(c.getFullYear(), c.getMonth(), c.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
      return { name: DL[i].name, d: d, text: d === 0 ? 'D-DAY' : 'D-' + d, closeText: DL[i].closeText, range: DL[i].range, open: now >= DL[i].open };
    }

}

  function c(t) { return String(t == null ? '' : t).replace(/[\t\r\n]+/g, ' ').trim(); }
  var lines = [['번호', '등록일시', '질문', '받은 학교', '질문자', '상태', '답변']].concat(rows.map(function (i) {
    return [all.length - all.indexOf(i), i.time, i.q, i.school, i.asker, i.status, i.answers.map(function (a) { return a.by + ': ' + a.text; }).join(' / ')].map(c);
  })).map(function (r) { return r.join('\t'); }).join('\n');
  function ok() { toast('✓ 표를 복사했습니다. 엑셀이나 구글 시트에 붙여넣으세요.'); }
  function fb() { var ta = document.createElement('textarea'); ta.value = lines; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy') ? ok() : toast('복사하지 못했습니다.'); } catch (e) { toast('복사하지 못했습니다.'); } document.body.removeChild(ta); }
  try { navigator.clipboard.writeText(lines).then(ok, fb); } catch (e) { fb(); }
}

/* ---- 통계: 구별 지원·접수 현황, 내신 성적대별 인원 ---- */
var STAT_VIEW = 'gu', STAT_TRK = '전체', STAT_OPEN = '';
var GU_ORDER = ['중구', '동구', '서구', '남구', '북구', '수성구', '달서구', '달성군', '군위군'];
var BANDS = [['1~50%', 0, 50], ['51~70%', 50, 70], ['71~80%', 70, 80], ['81~90%', 80, 90], ['91~100%', 90, 100.0001]];   // (아래, 위] 석차백분율
function guOf(name) {
  var n = String(name || '').trim(), m = window.SCHOOL_GU || {};
  if (m[n]) return m[n];
  var a = n.replace(/여자중학교$/, '여중').replace(/중학교$/, '중');
  return m[a] || '';
}
function statRows() { return D.rows.filter(function (r) { return r.단계 !== '타교지원'; }); }   // 지원자: 타교지원 제외
function bandOf(v) { return v <= 50 ? 0 : v <= 70 ? 1 : v <= 80 ? 2 : v <= 90 ? 3 : 4; }   // 석차백분율 → 성적대 번호
function pct(a, b) { return b ? Math.round(a / b * 1000) / 10 : 0; }

function viewStat() {
  if (D.me.role === '열람') return '<div class="card"><div class="qempty">열람 권한은 통계를 볼 수 없습니다.</div></div>';
  var h = '<div class="card"><div class="qtop"><div><h3 style="margin:0 0 4px">통계</h3><div class="mut" style="color:var(--mu);font-size:13px">지원자는 고민 중과 확정 학생이며, 타교지원 학생은 뺍니다.</div></div></div>' +
    '<div class="chips" style="margin-top:10px"><button type="button" class="' + (STAT_VIEW === 'gu' ? 'on' : '') + '" onclick="STAT_VIEW=\'gu\';render()">중학교 소재 구별</button>' +
    '<button type="button" class="' + (STAT_VIEW === 'band' ? 'on' : '') + '" onclick="STAT_VIEW=\'band\';render()">내신 성적대별</button></div></div>';
  return h + (STAT_VIEW === 'gu' ? statGu() : statBand());
}

/* 1) 구별: 지원자 대비 접수자 */
function statGu() {
  var rows = statRows().filter(function (r) { return STAT_TRK === '전체' || r.전형 === STAT_TRK; });
  var by = {}, unk = {};
  function slot(g) { return by[g] = by[g] || { schools: {}, n: 0, ok: 0, go: 0, acc: 0 }; }
  rows.forEach(function (r) {
    var g = guOf(r.중학교), s = slot(g || '기타');
    if (!g) unk[r.중학교 || '(학교 미입력)'] = 1;
    var sc = s.schools[r.중학교] = s.schools[r.중학교] || { n: 0, ok: 0, go: 0, acc: 0 };
    [s, sc].forEach(function (t) { t.n++; if (r.단계 === '확정') t.ok++; else t.go++; if (r.원서접수 === '접수') t.acc++; });
  });
  var order = GU_ORDER.concat(by['기타'] ? ['기타'] : []).filter(function (g) { return by[g]; });
  var tot = { n: 0, ok: 0, go: 0, acc: 0, sch: 0 }, max = 0;
  order.forEach(function (g) { var s = by[g]; tot.n += s.n; tot.ok += s.ok; tot.go += s.go; tot.acc += s.acc; tot.sch += Object.keys(s.schools).length; max = Math.max(max, s.n); });
  var h = '<div class="card stbl"><h3><span>중학교 소재 구·군별 지원 현황</span><span class="chips">' + ['전체', '취업희망자', '일반(특별포함)'].map(function (t) {
    return '<button type="button" class="' + (STAT_TRK === t ? 'on' : '') + '" onclick="STAT_TRK=\'' + t + '\';render()">' + t.replace('(특별포함)', '') + '</button>'; }).join('') + '</span></h3>';
  if (!order.length) return h + '<div class="empty">아직 입력된 학생이 없습니다.</div></div>';
  h += '<div class="wrap"><table class="gut"><thead><tr><th>구·군</th><th>학교 수</th><th>지원자</th><th>확정</th><th>고민 중</th><th>원서접수</th><th>접수율</th></tr></thead><tbody>';
  order.forEach(function (g) {
    var s = by[g], open = STAT_OPEN === g;
    h += '<tr class="grow' + (open ? ' open' : '') + '" onclick="STAT_OPEN=STAT_OPEN===\'' + g + '\'?\'\':\'' + g + '\';render()"><td><b>' + g + '</b> <span class="caret">' + (open ? '▾' : '▸') + '</span></td><td>' + Object.keys(s.schools).length + '</td>' +
      '<td class="nb"><span class="bar" style="width:' + Math.round(s.n / max * 100) + '%"></span><b>' + s.n + '</b></td><td>' + s.ok + '</td><td>' + s.go + '</td><td class="acc">' + s.acc + '</td><td>' + pct(s.acc, s.n) + '%</td></tr>';
    if (open) {
      Object.keys(s.schools).sort(function (a, b) { return s.schools[b].n - s.schools[a].n; }).forEach(function (n) {
        var t = s.schools[n];
        h += '<tr class="sub"><td>· ' + esc(n) + '</td><td></td><td>' + t.n + '</td><td>' + t.ok + '</td><td>' + t.go + '</td><td class="acc">' + t.acc + '</td><td>' + pct(t.acc, t.n) + '%</td></tr>';
      });
    }
  });
  h += '</tbody><tfoot><tr><td>합계</td><td>' + tot.sch + '</td><td>' + tot.n + '</td><td>' + tot.ok + '</td><td>' + tot.go + '</td><td class="acc">' + tot.acc + '</td><td>' + pct(tot.acc, tot.n) + '%</td></tr></tfoot></table></div>' +
    '<p class="note" style="color:var(--mu);font-size:12px;margin:10px 2px 0">구·군 줄을 누르면 학교별 인원이 펼쳐집니다. 접수율 = 원서접수 ÷ 지원자. 구 구분은 위키백과 「대구광역시의 중학교 목록」 기준입니다.' +
    (unk && Object.keys(unk).length ? '<br><b>구를 확인하지 못한 학교(기타):</b> ' + Object.keys(unk).map(esc).join(', ') : '') + '</p></div>';
  return h;
}

/* 2) 내신 성적대별: 취업희망자·일반 인원 표와 그래프 */
function statBand() {
  var rows = statRows(), T = '취업희망자', G = '일반(특별포함)';
  var cells = BANDS.map(function () { return { t: 0, g: 0, acc: 0 }; }), none = { t: 0, g: 0, acc: 0 };
  rows.forEach(function (r) {
    var v = r.내신 === '' || r.내신 == null ? NaN : Number(r.내신), c = isNaN(v) ? none : cells[bandOf(v)];
    if (r.전형 === T) c.t++; else c.g++;
    if (r.원서접수 === '접수') c.acc++;
  });
  var all = cells.concat(none.t + none.g ? [none] : []), names = BANDS.map(function (b) { return b[0]; }).concat(none.t + none.g ? ['내신 미입력'] : []);
  var sum = { t: 0, g: 0, acc: 0 }; all.forEach(function (c) { sum.t += c.t; sum.g += c.g; sum.acc += c.acc; });
  var total = sum.t + sum.g;
  var h = '<div class="card stbl"><h3><span>내신 성적대별 지원 인원</span></h3>';
  if (!total) return h + '<div class="empty">아직 입력된 학생이 없습니다.</div></div>';
  h += '<div class="wrap"><table class="bandt"><thead><tr><th>내신(석차백분율)</th><th>취업희망자</th><th>일반전형</th><th>합계</th><th>비율</th><th>접수</th></tr></thead><tbody>';
  all.forEach(function (c, i) { h += '<tr><td><b>' + names[i] + '</b></td><td>' + c.t + '</td><td>' + c.g + '</td><td><b>' + (c.t + c.g) + '</b></td><td>' + pct(c.t + c.g, total) + '%</td><td class="acc">' + c.acc + '</td></tr>'; });
  h += '</tbody><tfoot><tr><td>합계</td><td>' + sum.t + '</td><td>' + sum.g + '</td><td>' + total + '</td><td>100%</td><td class="acc">' + sum.acc + '</td></tr></tfoot></table></div>';
  // 막대그래프 (SVG)
  var W = 640, Hh = 300, L = 40, B = 40, T0 = 24, max = 1;
  all.forEach(function (c) { max = Math.max(max, c.t, c.g); });
  var step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : max <= 50 ? 10 : max <= 100 ? 20 : 50, top = Math.ceil(max / step) * step, ph = Hh - B - T0, gw = (W - L - 10) / all.length;
  var svg = '<svg viewBox="0 0 ' + W + ' ' + Hh + '" class="chart" role="img" aria-label="내신 성적대별 취업희망자와 일반전형 지원 인원 막대그래프">';
  for (var v = 0; v <= top; v += step) { var y = T0 + ph - v / top * ph; svg += '<line x1="' + L + '" x2="' + (W - 10) + '" y1="' + y + '" y2="' + y + '" class="grid"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end" class="ax">' + v + '</text>'; }
  all.forEach(function (c, i) {
    var x0 = L + i * gw, bw = Math.min(gw * 0.34, 46);
    [[c.t, 'bt', 0], [c.g, 'bg', 1]].forEach(function (p) {
      var bh = p[0] / top * ph, x = x0 + gw / 2 - bw - 2 + p[2] * (bw + 4);
      svg += '<rect x="' + x + '" y="' + (T0 + ph - bh) + '" width="' + bw + '" height="' + Math.max(bh, 0) + '" rx="3" class="' + p[1] + '"/><text x="' + (x + bw / 2) + '" y="' + (T0 + ph - bh - 5) + '" text-anchor="middle" class="val">' + p[0] + '</text>';
    });
    svg += '<text x="' + (x0 + gw / 2) + '" y="' + (Hh - 16) + '" text-anchor="middle" class="ax lb">' + names[i] + '</text>';
  });
  svg += '</svg>';
  h += '<div class="legend"><span><i class="bt"></i>취업희망자</span><span><i class="bg"></i>일반전형(특별포함)</span></div>' + svg +
    '<p class="note" style="color:var(--mu);font-size:12px;margin:6px 2px 0">내신은 석차백분율이며 낮을수록 성적이 높습니다. 1~50%는 50 이하, 51~70%는 50 초과 70 이하 …로 나눕니다. 타교지원 학생은 뺐습니다.</p></div>';
  return h;
}

  EVENTS.forEach(function (e) { if (e.id && e.t >= dayStart() && !FRESH[e.id]) FRESH[e.id] = { type: e.type, t: e.t }; });   // 다른 기기에서 막 들어온 학생도 같이 강조
  // 기기마다 다르지 않도록 시트에 기록된 시각으로 최근 소식을 채움
  EVENTS.sort(function (a, b) { return b.t - a.t; });
  EVENTS = EVENTS.slice(0, 8);
  PREVSNAP = rows.map(function (r) { return { ID: r.ID, 단계: r.단계, 원서접수: r.원서접수 }; });
  if (FRESH_TM) clearTimeout(FRESH_TM);
  if (anyFresh()) FRESH_TM = setTimeout(function () { FRESH_TM = null; if (D) softApply(D); }, msToMidnight() + 100);   // 자정이 지나면 빛을 끈다
}
function freshOf(id) {
  var f = FRESH[id]; if (!f) return null;
  var el = Date.now() - f.t;
  if (f.t < dayStart()) { delete FRESH[id]; return null; }   // 당일 입력만 강조
  return { type: f.type, el: el };
}
function anyFresh(trk) {
  if (!D) return false;
  return D.rows.some(function (r) { return (!trk || r.전형 === trk) && freshOf(r.ID); });
}
function deptFresh(trk, dept) {
  var o = null;
  D.rows.forEach(function (r) {
    if (r.전형 !== trk || r['1지망'] !== dept) return;
    var f = freshOf(r.ID); if (!f) return;
    o = o || { add: 0, cf: 0, rc: 0, el: f.el };
    if (f.type === 'add') o.add++; else if (f.type === 'confirm') o.cf++; else o.rc++;
    o.el = Math.min(o.el, f.el);
  });
  return o;
}
function elVar(el) { return '--el:-' + (el / 1000).toFixed(2) + 's'; }   // 다시 그려도 깜빡임이 처음부터 시작하지 않게
function freshChip(f) {
  if (!f) return '';
  return ' <span class="nw' + (f.type === 'add' ? '' : ' cf') + '" style="' + elVar(f.el) + '">' + (f.type === 'add' ? 'NEW' : f.type === 'confirm' ? '확정' : '접수') + '</span><span class="fleft" style="' + elVar(f.el) + '"></span>';
}
function sparks() {
  var cs = ['#f5b83d', '#e8508a', '#2f5bd8', '#22c55e', '#ffd66b'], h = '';
  for (var i = 0; i < 16; i++) h += '<span style="--r:' + (i * 22.5 + Math.random() * 10).toFixed(1) + 'deg;--d:' + Math.round(60 + Math.random() * 70) + 'px;--c:' + cs[i % 5] + ';animation-delay:' + Math.round(Math.random() * 80) + 'ms"></span>';
  return h;
}
var EV_LBL = { add: '새 입력', confirm: '확정', receipt: '원서접수' };
function agoText(t) { var s = Math.round((Date.now() - t) / 1000); return s < 5 ? '방금' : s < 60 ? s + '초 전' : s < 3600 ? Math.floor(s / 60) + '분 전' : s < 86400 ? Math.floor(s / 3600) + '시간 전' : Math.floor(s / 86400) + '일 전'; }
function liveHtml() {
  var h = '<div class="live" aria-live="polite"><span class="dot"></span><span class="lb">실시간</span><div class="feed"><div class="trk">';
  if (!EVENTS.length) h += '<span class="none">다른 선생님이 입력하거나 확정하면 여기에 바로 보여요. (30초마다 확인)</span>';
  EVENTS.forEach(function (e) {
    var hot = e.t >= dayStart();
    h += '<span class="ev' + (hot ? ' hot' : '') + (e.isNew ? ' new' : '') + '" role="button" tabindex="0" title="누르면 학생 정보" onclick="showStu(\'' + esc(e.id || '') + '\')" onkeydown="if(event.key===\'Enter\'){showStu(\'' + esc(e.id || '') + '\')}"><b>' + esc(e.who) + '</b> ' + (e.trk === '취업희망자' ? '' : '일반 · ') + esc(e.dept) + ' ' + EV_LBL[e.type] + ' <span class="ago" data-t="' + e.t + '">' + agoText(e.t) + '</span></span>';
    e.isNew = false;
  });
  return h + '</div></div></div>';
}
/* 현황 화면을 그린 뒤: 숫자는 이전 값에서 새 값으로 올라가고, 막대는 이전 길이에서 새 길이로 늘어난다 */
var MQ_T0 = Date.now();
function liveRun() {   // 소식이 줄에 다 안 들어가면 오른쪽에서 왼쪽으로 계속 흘려보낸다
  var f = document.querySelector('.live .feed'), t = f && f.querySelector('.trk');
  if (!t || t.scrollWidth <= f.clientWidth + 2) return;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { f.style.overflowX = 'auto'; return; }
  var w = t.scrollWidth + 8, dur = Math.max(18, Math.round(w / 45));   // 초당 약 45px
  t.insertAdjacentHTML('beforeend', t.innerHTML);
  t.style.setProperty('--mw', '-' + w + 'px');
  t.style.animation = 'liveRun ' + dur + 's linear infinite';
  t.style.animationDelay = '-' + (((Date.now() - MQ_T0) / 1000) % dur).toFixed(2) + 's';   // 다시 그려도 이어서 흐름
}
function animStatus() {
  liveRun();
  var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  Array.prototype.forEach.call(document.querySelectorAll('.cnum'), function (n) {
    var k = n.dataset.k, to = Number(n.dataset.v), from = CSHOWN[k] == null ? 0 : CSHOWN[k], first = CSHOWN[k] == null;
    CSHOWN[k] = to;
    if (from === to) { n.textContent = to; return; }
    if (!first) { n.classList.remove('bump'); void n.offsetWidth; n.classList.add('bump'); }
    if (still) { n.textContent = to; return; }
    var t0 = performance.now(), dur = first ? 1000 : 500;
    (function step(t) {
      var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      n.textContent = Math.round(from + (to - from) * e);
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  });
  var bars = document.querySelectorAll('.card.dept .bar i');
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    Array.prototype.forEach.call(bars, function (b) { b.style.width = b.dataset.w + '%'; BARW[b.dataset.ck] = Number(b.dataset.w); });
  }); });
}

/* ---- 실시간 소식을 누르면 학생 정보 카드(학생 목록과 같은 모양) ---- */
function stuCardHtml(r) {
  var admin = D.me.role === '관리자', out = isOut(r);
  var h = '<div class="card' + (r.단계 === '타교지원' ? ' gone' : '') + '" style="padding:12px 16px;margin:0"><div class="row" style="border:0;padding:0"><div class="t"><div>' +
    (grpRank(r) ? '<b>' + grpRank(r) + '위</b> ' : '') + (r.full ? '<b>' + esc(r.이름) + '</b> ' : '') + '<span style="color:var(--mu)">' + esc(r.중학교) + '</span>' +
    ' <span class="tag pr">' + esc(r.전형 === '취업희망자' ? '취업' : '일반') + ' · ' + esc(r['1지망']) + '</span></div><div>' +
    (out ? '<span class="tag er">정원 밖</span> ' : '') + stageTag(r.단계) + ' ' + recBtn(r, true) + (r.full && r.단계 === '고민' && r.고민내용 ? '<div class="n2" style="margin-left:auto">' + esc(r.고민내용) + '</div>' : '') + '</div></div>' +
    '<div class="s">내신 ' + esc(r.내신 === '' || r.내신 == null ? '-' : r.내신) + (r['2지망'] && r.전형 !== '취업희망자' ? ' · 2지망 ' + esc(r['2지망']) : '') + ' · 담당 ' + esc(r.담당교사) + '</div>';
  if (r.full) {
    h += '<div class="s">학생 ' + tel(r.학생연락처) + (r.보호자연락처 ? ' · 보호자 ' + tel(r.보호자연락처) : '') +
      '</div><div class="s">담임 ' + esc(r.담임성함) + ' ' + (r.담임연락처 ? tel(r.담임연락처) : '') + '</div>' +
      (r.메모 ? '<div class="s">유의사항: ' + esc(r.메모) + '</div>' : '') + (r.관리자메모 ? '<div class="s">관리자: ' + esc(r.관리자메모) + '</div>' : '');
  }
  if (r.mine || admin) h += '<div style="margin-top:8px;display:flex;gap:6px"><button class="btn s" onclick="edit(\'' + r.ID + '\')">수정</button><button class="btn s g" onclick="del(\'' + r.ID + '\')">삭제</button></div>';
  return h + '</div></div>';
}
function closeStu() { var m = $('smodal'); if (m) m.remove(); }
function showStu(id) {
  var r = D && D.rows.filter(function (x) { return x.ID === id; })[0];
  if (!r) { toast('학생 정보를 찾을 수 없습니다. (삭제되었거나 볼 수 없는 학생입니다)'); return; }
  closeStu();
  var m = document.createElement('div'); m.id = 'smodal';
  m.innerHTML = '<div class="sbox" role="dialog" aria-modal="true" aria-label="학생 정보"><button type="button" class="sx" aria-label="닫기">✕</button><div class="sh">학생 정보</div>' + stuCardHtml(r) + '</div>';
  m.onclick = function (e) { if (e.target === m || e.target.classList.contains('sx') || (e.target.tagName === 'BUTTON')) setTimeout(closeStu, 0); };
  document.body.appendChild(m);
  var x = m.querySelector('.sx'); if (x) x.focus();
}
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeStu(); });

/* 자동 새로고침 결과 반영: 입력·QnA 등 글을 쓰는 화면은 건드리지 않는다 */
function softApply(d) {
  if (!d || !d.me) return;
  if ($('busy') && !$('busy').classList.contains('hide')) return;
  D = d;
  if (TAB === 'status') {
    var w = document.querySelector('#main .wrap'), sl = w ? w.scrollLeft : 0;
    render();
    w = document.querySelector('#main .wrap'); if (w) w.scrollLeft = sl;
  } else if (TAB === 'home') {
    var hs = $('hmsum'); if (hs) hs.innerHTML = homeSumHtml();
  } else if (TAB === 'list' && $('lbody')) {
    listBody();
    navDot();
  } else navDot();
}
function navDot() {
  var b = Array.prototype.filter.call(document.querySelectorAll('#nav button'), function (x) { return x.textContent.indexOf('현황') === 0; })[0]; if (!b || TAB === 'status') return;
  var has = anyFresh(), dot = b.querySelector('.fdot');
  if (has && !dot) b.insertAdjacentHTML('beforeend', '<span class="fdot" title="오늘 새 입력·확정"></span>');
  if (!has && dot) dot.remove();
}
setInterval(function () {
  if (document.hidden || !D || SAVING || TAB === 'form') return;   // 화면을 보고 있을 때만, 입력 중에는 쉬기
  load(true);
}, AUTO_MS);
document.addEventListener('visibilitychange', function () { if (!document.hidden && D && !SAVING && TAB !== 'form') load(true); });
setInterval(function () { Array.prototype.forEach.call(document.querySelectorAll('.live .ago'), function (a) { a.textContent = agoText(+a.dataset.t); }); }, 1000);

FORM = { 단계: '' };
/* 새 버전 확인: 브라우저가 옛 화면을 붙들고 있으면 알려준다 */
var APP_VER = '2026-10-15.5';
function checkUpdate() {
  try {
    fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
      var m = t.match(/var APP_VER = '([^']+)'/);
      if (m && m[1] !== APP_VER) $('upd').classList.remove('hide');
    }).catch(function () {});
  } catch (e) {}
}
$('ver').textContent = '버전 ' + APP_VER;
load();
checkUpdate();
</script>
