<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f5bd8">
<title>입학 홍보 현황</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1f2937;--mu:#6b7280;--pr:#2f5bd8;--ok:#16a34a;--wa:#d97706;--er:#dc2626;--bd:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--pr:#7b9cff;--bd:#374151}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,'Malgun Gothic',sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:16px}
header span{color:var(--mu);font-size:13px}
nav{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto}
nav button{border:0;background:transparent;color:var(--mu);padding:8px 12px;border-radius:8px;font:inherit;font-weight:600;white-space:nowrap}
nav button.on{background:var(--pr);color:#fff}
main{padding:12px 16px 80px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--pr)}
.bar i.f{background:var(--er)}
.kv{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mu)}
.kv b{color:var(--tx)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-weight:700}
.seg button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.seg button.on.ok{background:var(--ok);border-color:var(--ok)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--pr);color:#fff;font:inherit;font-weight:700;margin-top:14px}
.btn.s{display:inline-block;width:auto;padding:7px 12px;margin:0;font-size:13px}
.btn.g{background:var(--bd);color:var(--tx)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bd)}
.tag.ok{background:#dcfce7;color:#166534}.tag.wa{background:#fef3c7;color:#92400e}.tag.er{background:#fee2e2;color:#991b1b}.tag.pr{background:#dbe5ff;color:#1e3a8a}
.row{border-top:1px solid var(--bd);padding:10px 0}
.row:first-child{border-top:0}
.row .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.row .s{font-size:13px;color:var(--mu);margin-top:3px}
a{color:var(--pr)}
.notice{background:#fef3c7;color:#78350f;border-radius:10px;padding:10px 14px;margin-bottom:12px}
.msg{position:fixed;left:16px;right:16px;bottom:16px;padding:12px 14px;border-radius:10px;background:#111827;color:#fff;z-index:9;display:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.wrap{overflow-x:auto}
.hide{display:none!important}
.login{max-width:420px;margin:7vh auto 0}
.login .brand{text-align:center;margin-bottom:22px}
.login .logo{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(135deg,var(--pr),#6d8cff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:800;box-shadow:0 8px 20px rgba(47,91,216,.28)}
.login h1{margin:0;font-size:22px;letter-spacing:-.3px}
.login .sub{margin:6px 0 0;color:var(--mu);font-size:14px}
.login .box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px 20px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.login label{margin-top:0;margin-bottom:6px;font-weight:600;color:var(--tx);font-size:13px}
.login .f{margin-bottom:16px}
.login input{padding:13px;font-size:16px}
.login .hint{margin:4px 0 0;color:var(--mu);font-size:12px}
.login .err{background:#fee2e2;color:#991b1b;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:14px}
@media (prefers-color-scheme:dark){.login .err{background:#3b1d1d;color:#fecaca}}
.login .foot{text-align:center;margin-top:16px;color:var(--mu);font-size:12px}
</style>
<script src="config.js"></script>
</head>
<body>
<header><b>입학 홍보 현황</b><span id="who"></span></header>
<nav id="nav"></nav>
<main id="main">불러오는 중…</main>
<div class="msg" id="msg"></div>

<script>
var CODE = { n: '', c: '' };   // 이름 + 접속코드 (이 폰에만 저장)
try { CODE = JSON.parse(localStorage.getItem('hb_cred') || '') || CODE; } catch (e) {}
var D = null, TAB = 'status', TRK = '취업희망자', FILTER = '', SEL = {}, EDIT = null;
var TRACKS = ['취업희망자', '일반(특별포함)'], DEPTS = ['상업정보', '3D융합콘텐츠', '보건행정코디'];
var ADJ = ['미지정', '지원요청', '지원대기', '지원확정', '타교지원', '포기'];
var FORM = {};

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(t) { var m = $('msg'); m.textContent = t; m.style.display = 'block'; setTimeout(function () { m.style.display = 'none'; }, 2600); }
function call(fn) {
  var args = [].slice.call(arguments, 1);
  var url = (window.PROMO_CONFIG || {}).apiUrl || '';
  if (url.indexOf('https://script.google.com/') !== 0 || url.slice(-5) !== '/exec') return Promise.reject(new Error('config.js 의 apiUrl 에 웹앱 주소(/exec)를 넣어야 합니다.'));
  return fetch(url, { method: 'POST', body: JSON.stringify({ fn: fn, cred: CODE, args: args }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error); return j.data; });
}
function tel(n) { n = String(n || '').trim(); return n ? '<a href="tel:' + esc(n.replace(/[^0-9+]/g, '')) + '">' + esc(n) + '</a>' : '-'; }
function adjTag(a) {
  var c = {지원요청: 'wa', 지원대기: 'er', 지원확정: 'ok', 타교지원: '', 포기: ''}[a];
  return a && a !== '미지정' ? '<span class="tag ' + (c || '') + '">' + a + '</span>' : '';
}

function load() {
  if (!CODE.n || !CODE.c) return loginView('');
  call('getData').then(function (d) { D = d; render(); }).catch(function (e) {
    if (String(e.message || e).indexOf('NOAUTH') >= 0) loginView('이름 또는 접속코드가 맞지 않습니다.');
    else $('main').innerHTML = '<div class="card">오류: ' + esc(e.message || e) + '</div>';
  });
}
function loginView(err) {
  $('nav').innerHTML = ''; $('who').textContent = '';
  document.querySelector('header').classList.add('hide');
  $('main').innerHTML = '<div class="login"><div class="brand"><div class="logo">입</div><h1>입학 홍보 현황</h1>' +
    '<p class="sub">경북여상 · 중학교 홍보 교사용</p></div>' +
    '<form class="box" id="lf" autocomplete="off">' +
    (err ? '<div class="err">' + esc(err) + '</div>' : '') +
    '<div class="f"><label for="ln">이름</label><input id="ln" placeholder="예: 홍길동" value="' + esc(CODE.n) + '" enterkeyhint="next"></div>' +
    '<div class="f"><label for="lc">접속코드</label><input id="lc" type="password" inputmode="numeric" placeholder="숫자 6자리" enterkeyhint="go">' +
    '<p class="hint">교사: 교무실에서 안내받은 코드 · 관리자: 관리자 코드</p></div>' +
    '<button class="btn" type="submit" style="margin-top:6px">확인</button></form>' +
    '<p class="foot">처음 한 번만 입력하면 이 기기에 저장됩니다.</p></div>';
  $('lf').onsubmit = function (e) { e.preventDefault(); doLogin(); };
  $('ln').onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); if ($('ln').value.trim()) $('lc').focus(); } };
  ($('ln').value ? $('lc') : $('ln')).focus();
}
function doLogin() {
  var n = $('ln').value.replace(/\s+/g, ''), c = $('lc').value.trim();
  if (!n || !c) return toast('이름과 접속코드를 입력하세요.');
  CODE = { n: n, c: c };
  try { localStorage.setItem('hb_cred', JSON.stringify(CODE)); } catch (e) {}
  load();
}
function logout() { CODE = { n: CODE.n, c: '' }; try { localStorage.removeItem('hb_cred'); } catch (e) {} D = null; loginView(''); }

function render() {
  document.querySelector('header').classList.remove('hide');
  var r = D.me.role;
  $('who').innerHTML = esc(D.me.name) + ' · ' + r + ' <a href="#" onclick="logout();return false">다른 이름</a>';
  var tabs = [['status', '현황']];
  if (r !== '열람') tabs.push(['form', '입력'], ['list', r === '관리자' ? '전체 관리' : '학생 목록']);
  $('nav').innerHTML = tabs.map(function (t) { return '<button class="' + (TAB === t[0] ? 'on' : '') + '" onclick="TAB=\'' + t[0] + '\';render()">' + t[1] + '</button>'; }).join('');
  if (TAB === 'status') $('main').innerHTML = viewStatus();
  else if (TAB === 'form') { $('main').innerHTML = viewForm(); bindForm(); }
  else $('main').innerHTML = viewList();
}

/* ---- 현황 ---- */
function viewStatus() {
  var h = '';
  if (D.notices.length) {
    h += '<div class="notice"><b>관리자 안내</b><br>' + D.notices.map(function (n) {
      return esc(n.중학교) + ' ' + esc(n.이름) + ' (' + esc(n.계열) + ') → <b>' + n.상태 + '</b>'; }).join('<br>') + '</div>';
  }
  h += '<div class="seg" style="margin-bottom:12px">' + TRACKS.map(function (t) {
    return '<button class="' + (TRK === t ? 'on' : '') + '" onclick="TRK=\'' + t + '\';render()">' + t + '</button>'; }).join('') + '</div><div class="grid">';
  D.summary.filter(function (s) { return s.전형 === TRK; }).forEach(function (s) {
    var pct = s.정원 ? Math.min(100, Math.round(s.합계 / s.정원 * 100)) : 0, over = s.합계 > s.정원;
    h += '<div class="card"><h3>' + s.계열 + ' <span class="tag ' + (over ? 'er' : 'pr') + '">' + (over ? '정원 초과' : '정원 ' + s.정원) + '</span></h3>' +
      '<div style="font-size:22px;font-weight:800">' + s.합계 + ' <span style="font-size:13px;color:var(--mu);font-weight:400">/ ' + s.정원 + '명 (1지망)</span></div>' +
      '<div class="bar"><i class="' + (over ? 'f' : '') + '" style="width:' + pct + '%"></i></div>' +
      '<div class="kv"><span>확정 <b>' + s.확정 + '</b></span><span>고민 <b>' + s.고민 + '</b></span><span>2지망 <b>' + s.이지망 + '</b></span></div>' +
      '<div class="kv" style="margin-top:4px"><span>지원요청 <b>' + s.지원요청 + '</b></span><span>지원대기 <b>' + s.지원대기 + '</b></span><span>지원확정 <b>' + s.지원확정 + '</b></span></div></div>';
  });
  return h + '</div><p style="color:var(--mu);font-size:12px">1지망 기준 · 타교지원·포기 제외 · 순위는 내신(석차백분율)이 낮을수록 상위</p>';
}

/* ---- 입력 ---- */
function viewForm() {
  var f = FORM, e = EDIT;
  function v(k) { return esc(f[k] || ''); }
  function opt(list, k, blank) { return (blank ? '<option value="">선택 안 함</option>' : '') + list.map(function (x) { return '<option' + (f[k] === x ? ' selected' : '') + '>' + x + '</option>'; }).join(''); }
  return '<div class="card"><h3>' + (e ? '학생 정보 수정' : '학생 입력') + '</h3>' +
    '<label>단계</label><div class="seg" id="stg"><button type="button" data-v="고민" class="' + (f.단계 === '고민' ? 'on' : '') + '">고민 중</button><button type="button" data-v="확정" class="' + (f.단계 === '확정' ? 'on ok' : '') + '">확정</button></div>' +
    '<label>전형</label><select id="f_전형">' + opt(TRACKS, '전형') + '</select>' +
    '<div class="two"><div><label>중학교</label><input id="f_중학교" value="' + v('중학교') + '" placeholder="예: 경일여중"></div>' +
    '<div><label>학생 이름</label><input id="f_이름" value="' + v('이름') + '"></div></div>' +
    '<div class="two"><div><label>학생 연락처</label><input id="f_학생연락처" type="tel" value="' + v('학생연락처') + '" placeholder="010-0000-0000"></div>' +
    '<div><label>보호자 연락처 (선택)</label><input id="f_보호자연락처" type="tel" value="' + v('보호자연락처') + '"></div></div>' +
    '<div class="two"><div><label>중학교 담임 성함</label><input id="f_담임성함" value="' + v('담임성함') + '"></div>' +
    '<div><label>담임 연락처 (선택)</label><input id="f_담임연락처" type="tel" value="' + v('담임연락처') + '"></div></div>' +
    '<div class="two"><div><label>내신 (석차백분율, 낮을수록 상위)</label><input id="f_내신" type="number" step="0.001" inputmode="decimal" value="' + v('내신') + '" placeholder="예: 28.04"></div>' +
    '<div><label>인성</label><select id="f_인성">' + opt(['상', '중', '하'], '인성', true) + '</select></div></div>' +
    '<div class="two"><div><label>1지망 계열</label><select id="f_1지망">' + opt(DEPTS, '1지망') + '</select></div>' +
    '<div><label>2지망 계열</label><select id="f_2지망">' + opt(DEPTS, '2지망', true) + '</select></div></div>' +
    '<label>메모</label><textarea id="f_메모" rows="2">' + v('메모') + '</textarea>' +
    '<button class="btn" id="saveBtn">' + (e ? '수정 저장' : '저장') + '</button>' +
    (e ? '<button class="btn g" onclick="EDIT=null;FORM={};render()">취소</button>' : '') + '</div>';
}
function bindForm() {
  Array.prototype.forEach.call(document.querySelectorAll('#stg button'), function (b) {
    b.onclick = function () { FORM.단계 = b.dataset.v; readForm(); render(); };
  });
  $('saveBtn').onclick = function () { save(false); };
}
function readForm() {
  ['전형', '중학교', '이름', '학생연락처', '보호자연락처', '담임성함', '담임연락처', '내신', '인성', '1지망', '2지망', '메모'].forEach(function (k) {
    var el = $('f_' + k); if (el) FORM[k] = el.value;
  });
}
function save(force) {
  readForm();
  if (!FORM.단계) return toast('단계(고민/확정)를 선택하세요.');
  var o = JSON.parse(JSON.stringify(FORM)); if (EDIT) o.ID = EDIT;
  $('saveBtn').disabled = true;
  call('saveStudent', o, force).then(function (r) {
    $('saveBtn').disabled = false;
    if (r.duplicate) {
      if (confirm('이미 입력된 학생입니다.\n입력 교사: ' + r.입력교사 + ' / ' + r.전형 + ' / ' + r.단계 + ' (' + r.입력일시 + ')\n\n그래도 새로 저장할까요?')) save(true);
      return;
    }
    toast('저장했습니다.');
    var keep = { 전형: FORM.전형, 중학교: FORM.중학교, 담임성함: FORM.담임성함, 담임연락처: FORM.담임연락처, 단계: FORM.단계 };
    FORM = EDIT ? {} : keep;   // 새 입력이면 같은 중학교 연속 입력 편의를 위해 학교·담임은 유지
    EDIT = null;
    TAB = 'form'; load();
  }).catch(function (e) { $('saveBtn').disabled = false; toast(e.message || e); });
}

/* ---- 목록 ---- */
function viewList() {
  var admin = D.me.role === '관리자';
  var rows = D.rows.filter(function (r) { return !FILTER || [r.중학교, r.이름, r['1지망'], r.단계, r.조정상태, r.입력교사].join(' ').indexOf(FILTER) >= 0; });
  var h = '<div class="card"><input id="flt" placeholder="검색 (학교·이름·계열·교사…)" value="' + esc(FILTER) + '" onchange="FILTER=this.value;render()">';
  if (admin) {
    h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center"><select id="adj" style="width:auto">' + ADJ.map(function (a) { return '<option>' + a + '</option>'; }).join('') + '</select>' +
      '<input id="amemo" placeholder="관리자 메모(선택)" style="flex:1;min-width:140px">' +
      '<button class="btn s" onclick="applyAdj()">선택 학생에 적용</button></div>';
  }
  h += '</div>';
  var sorted = rows.slice().sort(function (a, b) {
    if (a.전형 !== b.전형) return a.전형 < b.전형 ? -1 : 1;
    if (a['1지망'] !== b['1지망']) return a['1지망'] < b['1지망'] ? -1 : 1;
    return (a.순위 || 9999) - (b.순위 || 9999);
  });
  var cur = '';
  sorted.forEach(function (r) {
    var g = r.전형 + ' · ' + r['1지망'];
    if (g !== cur) { cur = g; h += '<h3 style="margin:14px 0 6px">' + esc(g) + '</h3>'; }
    var cap = (D.summary.filter(function (s) { return s.전형 === r.전형 && s.계열 === r['1지망']; })[0] || {}).정원 || 0;
    var out = r.순위 && cap && r.순위 > cap;
    h += '<div class="card" style="padding:10px 14px"><div class="row" style="border:0;padding:0"><div class="t"><div>' +
      (admin ? '<input type="checkbox" style="width:auto;margin-right:8px" ' + (SEL[r.ID] ? 'checked' : '') + ' onchange="SEL[\'' + r.ID + '\']=this.checked">' : '') +
      (r.순위 ? '<b>' + r.순위 + '위</b> ' : '') + (r.full ? '<b>' + esc(r.이름) + '</b> ' : '') + '<span style="color:var(--mu)">' + esc(r.중학교) + '</span></div><div>' +
      (out ? '<span class="tag er">정원 밖</span> ' : '') + '<span class="tag ' + (r.단계 === '확정' ? 'ok' : 'wa') + '">' + r.단계 + '</span> ' + adjTag(r.조정상태) + '</div></div>' +
      '<div class="s">내신 ' + esc(r.내신 === '' || r.내신 == null ? '-' : r.내신) + (r['2지망'] ? ' · 2지망 ' + esc(r['2지망']) : '') + ' · 입력 ' + esc(r.입력교사) +
      (r.full ? ' · 인성 ' + esc(r.인성 || '-') : '') + '</div>';
    if (r.full) {
      h += '<div class="s">학생 ' + tel(r.학생연락처) + (r.보호자연락처 ? ' · 보호자 ' + tel(r.보호자연락처) : '') +
        '</div><div class="s">담임 ' + esc(r.담임성함) + ' ' + (r.담임연락처 ? tel(r.담임연락처) : '') + '</div>' +
        (r.메모 ? '<div class="s">메모: ' + esc(r.메모) + '</div>' : '') + (r.관리자메모 ? '<div class="s">관리자: ' + esc(r.관리자메모) + '</div>' : '');
    }
    if (r.mine || admin) h += '<div style="margin-top:8px;display:flex;gap:6px"><button class="btn s" onclick="edit(\'' + r.ID + '\')">수정</button><button class="btn s g" onclick="del(\'' + r.ID + '\')">삭제</button></div>';
    h += '</div></div>';
  });
  return h + (sorted.length ? '' : '<div class="card">표시할 학생이 없습니다.</div>');
}
function edit(id) {
  var r = D.rows.filter(function (x) { return x.ID === id; })[0];
  FORM = { 전형: r.전형, 중학교: r.중학교, 이름: r.이름, 학생연락처: r.학생연락처, 보호자연락처: r.보호자연락처, 담임성함: r.담임성함, 담임연락처: r.담임연락처,
    내신: r.내신, 인성: r.인성, '1지망': r['1지망'], '2지망': r['2지망'], 메모: r.메모, 단계: r.단계 };
  EDIT = id; TAB = 'form'; render(); scrollTo(0, 0);
}
function del(id) {
  if (!confirm('이 학생 기록을 삭제할까요?')) return;
  call('removeStudent', id).then(function () { toast('삭제했습니다.'); load(); }).catch(function (e) { toast(e.message || e); });
}
function applyAdj() {
  var ids = Object.keys(SEL).filter(function (k) { return SEL[k]; });
  if (!ids.length) return toast('학생을 먼저 체크하세요.');
  call('setAdjust', ids, $('adj').value, $('amemo').value).then(function (r) { SEL = {}; toast(r.count + '명 적용'); load(); }).catch(function (e) { toast(e.message || e); });
}

FORM = { 단계: '' };
load();
</script>
