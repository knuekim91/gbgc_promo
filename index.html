<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f5bd8">
<title>경북여상 원서접수현황</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1f2937;--mu:#6b7280;--pr:#2f5bd8;--ok:#16a34a;--wa:#d97706;--er:#dc2626;--bd:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--pr:#7b9cff;--bd:#374151}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,'Malgun Gothic',sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:16px}
header span{color:var(--mu);font-size:13px}
nav{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto}
nav button{border:0;background:transparent;color:var(--mu);padding:8px 12px;border-radius:8px;font:inherit;font-weight:600;white-space:nowrap}
nav button.on{background:var(--pr);color:#fff}
main{padding:12px 16px 80px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--pr)}
.bar i.f{background:var(--er)}
.kv{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mu)}
.kv b{color:var(--tx)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-weight:700}
.seg button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.seg button.on.ok{background:var(--ok);border-color:var(--ok)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;background:var(--pr);color:#fff;font:inherit;font-weight:700;margin-top:14px}
.btn.s{display:inline-block;width:auto;padding:7px 12px;margin:0;font-size:13px}
.btn.g{background:var(--bd);color:var(--tx)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bd)}
.tag.ok{background:#dcfce7;color:#166534}.tag.wa{background:#fef3c7;color:#92400e}.tag.er{background:#fee2e2;color:#991b1b}.tag.pr{background:#dbe5ff;color:#1e3a8a}
.row{border-top:1px solid var(--bd);padding:10px 0}
.row:first-child{border-top:0}
.row .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.row .s{font-size:13px;color:var(--mu);margin-top:3px}
a{color:var(--pr)}
.notice{background:#fef3c7;color:#78350f;border-radius:10px;padding:10px 14px;margin-bottom:12px}
.msg{position:fixed;left:16px;right:16px;bottom:16px;padding:12px 14px;border-radius:10px;background:#111827;color:#fff;z-index:9;display:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.wrap{overflow-x:auto}
.hide{display:none!important}
.login{max-width:420px;margin:7vh auto 0}
.login .brand{text-align:center;margin-bottom:22px}
.login .logo{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(135deg,var(--pr),#6d8cff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:800;box-shadow:0 8px 20px rgba(47,91,216,.28)}
.login h1{margin:0;font-size:22px;letter-spacing:-.3px}
.login .sub{margin:6px 0 0;color:var(--mu);font-size:14px}
.login .box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px 20px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.login label{margin-top:0;margin-bottom:6px;font-weight:600;color:var(--tx);font-size:13px}
.login .f{margin-bottom:16px}
.login input{padding:13px;font-size:16px}
.login .hint{margin:4px 0 0;color:var(--mu);font-size:12px}
.login .err{background:#fee2e2;color:#991b1b;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:14px}
@media (prefers-color-scheme:dark){.login .err{background:#3b1d1d;color:#fecaca}}
.login .foot{text-align:center;margin-top:16px;color:var(--mu);font-size:12px}
#busy{position:fixed;inset:0;z-index:20;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#busy .bx{background:var(--card);color:var(--tx);border-radius:14px;padding:20px 26px;display:flex;align-items:center;gap:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.spin{width:22px;height:22px;border:3px solid var(--bd);border-top-color:var(--pr);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.btn:disabled{opacity:.6}
.card.dept{cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;border-width:2px;position:relative}
.card.dept:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.card.dept:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.card.dept.sel{border-color:var(--pr);background:linear-gradient(180deg,var(--selbg),var(--card) 70%);box-shadow:0 0 0 4px var(--selring),0 10px 26px var(--selsh)}
.card.dept .pick{margin-top:8px;font-size:12px;font-weight:700;color:var(--pr)}
:root{--selbg:#e7eeff;--selring:rgba(47,91,216,.18);--selsh:rgba(47,91,216,.18)}
@media (prefers-color-scheme:dark){:root{--selbg:#25325c;--selring:rgba(123,156,255,.28);--selsh:rgba(123,156,255,.2)}}
.stbl h3{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.stbl table{min-width:680px}
.stbl th{background:var(--bg);color:var(--mu);font-size:12px;white-space:nowrap}
.stbl td{white-space:nowrap}
.stbl tr.out td{background:rgba(220,38,38,.06)}
.stbl .mut{color:var(--mu)}
.stbl .rk{font-weight:800;text-align:center}
.stbl .empty{padding:22px;text-align:center;color:var(--mu)}
.chips{display:flex;gap:6px}
.chips button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.chips button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.pchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:thin}
.pchips button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.pchips button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.pnote{font-size:12px;color:var(--mu);margin:2px 0 10px}
.pwrap{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.pwrap{grid-template-columns:minmax(0,520px) minmax(0,1fr);align-items:start}}
.pv{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.pv .scroller{overflow:auto;max-height:80vh;-webkit-overflow-scrolling:touch;text-align:center}
.pv img{display:block;width:100%;height:auto;margin:0 auto;cursor:zoom-in;user-select:none;-webkit-user-drag:none}
.pv.zoom img{width:210%;max-width:none;cursor:grab}
.pnav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:42px;height:64px;border:0;border-radius:10px;background:rgba(17,24,39,.55);color:#fff;font-size:28px;cursor:pointer}
.pnav.prev{left:6px}.pnav.next{right:6px}
.pnav:disabled{opacity:.25;cursor:default}
.pfsbar{display:none}
.perr{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;background:var(--card);color:var(--tx);cursor:pointer}
.pv:fullscreen{background:#000;border:0;border-radius:0;width:100vw;height:100vh}
.pv:fullscreen .scroller{max-height:none;height:100vh;display:flex;align-items:center;justify-content:center;overflow:auto}
.pv:fullscreen img{width:auto;height:100vh;max-width:100%;margin:auto;object-fit:contain}
.pv:fullscreen.zoom .scroller{display:block}
.pv:fullscreen.zoom img{width:100%;height:auto;max-width:none;object-fit:initial}
.pv:fullscreen .pfsbar{display:flex;position:absolute;top:0;left:0;right:0;z-index:5;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,0));color:#fff;font-size:15px;font-weight:700;pointer-events:none}
.pv:fullscreen .pfsbar button{pointer-events:auto;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.45);color:#fff;border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.pbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
.pbar .ttl{font-weight:800}
.pbar .sub{color:var(--mu);font-size:13px}
.ppts ul{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px;line-height:1.5}
.pthumbs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.pthumbs img{flex:none;width:76px;height:auto;border:2px solid var(--bd);border-radius:6px;cursor:pointer;opacity:.75}
.pthumbs img.on{border-color:var(--pr);opacity:1;box-shadow:0 0 0 3px var(--selring)}
.seg button.on.gone{background:#6b7280;border-color:#6b7280}
.card.gone{opacity:.62}
</style>
<script src="config.js"></script>
<script src="promo-data.js"></script>
</head>
<body>
<header><b>경북여상 원서접수현황</b><span id="who"></span></header>
<nav id="nav"></nav>
<main id="main">불러오는 중…</main>
<div class="msg" id="msg"></div>
<div id="busy" class="hide" role="status" aria-live="polite"><div class="bx"><span class="spin"></span><span id="busyt">처리 중…</span></div></div>

<script>
var CODE = { n: '', c: '' };   // 이름 + 접속코드 (이 폰에만 저장)
try { CODE = JSON.parse(localStorage.getItem('hb_cred') || '') || CODE; } catch (e) {}
var SELDEPT = '상업정보', VIEW2 = false, PSEC = 0, PIDX = 0;
var D = null, TAB = 'status', TRK = '취업희망자', FILTER = '', SEL = {}, EDIT = null;
var TRACKS = ['취업희망자', '일반(특별포함)'], DEPTS = ['상업정보', '보건행정코디', '3D융합콘텐츠'];
var ADJ = ['미지정', '지원요청', '지원대기', '지원확정', '타교지원', '포기'];
var FORM = {};

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function busy(t) { $('busyt').textContent = t || '처리 중…'; $('busy').classList.remove('hide'); }
function idle() { $('busy').classList.add('hide'); }
function toast(t) { var m = $('msg'); m.textContent = t; m.style.display = 'block'; setTimeout(function () { m.style.display = 'none'; }, 2600); }
function call(fn) {
  var args = [].slice.call(arguments, 1);
  var url = (window.PROMO_CONFIG || {}).apiUrl || '';
  if (url.indexOf('https://script.google.com/') !== 0 || url.slice(-5) !== '/exec') return Promise.reject(new Error('config.js 의 apiUrl 에 웹앱 주소(/exec)를 넣어야 합니다.'));
  return fetch(url, { method: 'POST', body: JSON.stringify({ fn: fn, cred: CODE, args: args }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error); return j.data; });
}
function tel(n) { n = String(n || '').trim(); return n ? '<a href="tel:' + esc(n.replace(/[^0-9+]/g, '')) + '">' + esc(n) + '</a>' : '-'; }
function adjTag(a) {
  var c = {지원요청: 'wa', 지원대기: 'er', 지원확정: 'ok', 타교지원: '', 포기: ''}[a];
  return a && a !== '미지정' ? '<span class="tag ' + (c || '') + '">' + a + '</span>' : '';
}

function load() {
  if (!CODE.n || !CODE.c) { loginView(''); return Promise.resolve(); }
  return call('getData').then(function (d) {
    if (TAB === 'form' && $('f_이름')) readForm();   // 입력 중인 내용 보존
    D = d; render();
  }).catch(function (e) {
    if (String(e.message || e).indexOf('NOAUTH') >= 0) loginView('이름 또는 접속코드가 맞지 않습니다.');
    else $('main').innerHTML = '<div class="card">오류: ' + esc(e.message || e) + '</div>';
  });
}
function loginView(err) {
  $('nav').innerHTML = ''; $('who').textContent = '';
  document.querySelector('header').classList.add('hide');
  $('main').innerHTML = '<div class="login"><div class="brand"><div class="logo">원</div><h1>경북여상 원서접수현황</h1>' +
    '<p class="sub">경북여상 · 중학교 홍보 교사용</p></div>' +
    '<form class="box" id="lf" autocomplete="off">' +
    (err ? '<div class="err">' + esc(err) + '</div>' : '') +
    '<div class="f"><label for="ln">이름</label><input id="ln" placeholder="예: 홍길동" value="' + esc(CODE.n) + '" enterkeyhint="next"></div>' +
    '<div class="f"><label for="lc">접속코드</label><input id="lc" type="password" inputmode="numeric" placeholder="숫자 6자리" enterkeyhint="go">' +
    '<p class="hint">교사: 교무실에서 안내받은 코드 · 관리자: 관리자 코드</p></div>' +
    '<button class="btn" type="submit" style="margin-top:6px">확인</button></form>' +
    '<p class="foot">처음 한 번만 입력하면 이 기기에 저장됩니다.</p></div>';
  $('lf').onsubmit = function (e) { e.preventDefault(); doLogin(); };
  $('ln').onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); if ($('ln').value.trim()) $('lc').focus(); } };
  ($('ln').value ? $('lc') : $('ln')).focus();
}
function doLogin() {
  var n = $('ln').value.replace(/\s+/g, ''), c = $('lc').value.trim();
  if (!n || !c) return toast('이름과 접속코드를 입력하세요.');
  CODE = { n: n, c: c };
  try { localStorage.setItem('hb_cred', JSON.stringify(CODE)); } catch (e) {}
  busy('확인 중입니다…');
  load().then(idle, idle);
}
function logout() { CODE = { n: CODE.n, c: '' }; try { localStorage.removeItem('hb_cred'); } catch (e) {} D = null; loginView(''); }

function render() {
  document.querySelector('header').classList.remove('hide');
  var r = D.me.role;
  $('who').innerHTML = esc(D.me.name) + ' · ' + r + ' <a href="#" onclick="logout();return false">다른 이름</a>';
  var tabs = [['status', '현황']];
  if (r !== '열람') tabs.push(['form', '입력'], ['list', r === '관리자' ? '전체 관리' : '학생 목록']);
  tabs.push(['promo', '홍보자료']);
  $('nav').innerHTML = tabs.map(function (t) { return '<button class="' + (TAB === t[0] ? 'on' : '') + '" onclick="TAB=\'' + t[0] + '\';render()">' + t[1] + '</button>'; }).join('');
  if (TAB === 'status') $('main').innerHTML = viewStatus();
  else if (TAB === 'form') { $('main').innerHTML = viewForm(); bindForm(); }
  else if (TAB === 'promo') { $('main').innerHTML = viewPromo(); bindPromo(); }
  else $('main').innerHTML = viewList();
}

/* ---- 현황 ---- */
function viewStatus() {
  var h = '';
  if (D.notices.length) {
    h += '<div class="notice"><b>관리자 안내</b><br>' + D.notices.map(function (n) {
      return esc(n.중학교) + ' ' + esc(n.이름) + ' (' + esc(n.계열) + ') → <b>' + n.상태 + '</b>'; }).join('<br>') + '</div>';
  }
  h += '<div class="seg" style="margin-bottom:12px">' + TRACKS.map(function (t) {
    return '<button class="' + (TRK === t ? 'on' : '') + '" onclick="TRK=\'' + t + '\';render()">' + t + '</button>'; }).join('') + '</div><div class="grid">';
  D.summary.filter(function (s) { return s.전형 === TRK; }).forEach(function (s) {
    var pct = s.정원 ? Math.min(100, Math.round(s.합계 / s.정원 * 100)) : 0, over = s.합계 > s.정원;
    h += '<div class="card dept' + (SELDEPT === s.계열 ? ' sel' : '') + '" tabindex="0" role="button" aria-pressed="' + (SELDEPT === s.계열) + '" onclick="pickDept(\'' + s.계열 + '\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();pickDept(\'' + s.계열 + '\')}"><h3>' + s.계열 + ' <span class="tag ' + (over ? 'er' : 'pr') + '">' + (over ? '정원 초과' : '정원 ' + s.정원) + '</span></h3>' +
      '<div style="font-size:22px;font-weight:800">' + s.합계 + ' <span style="font-size:13px;color:var(--mu);font-weight:400">/ ' + s.정원 + '명 (1지망)</span></div>' +
      '<div class="bar"><i class="' + (over ? 'f' : '') + '" style="width:' + pct + '%"></i></div>' +
      '<div class="kv"><span>확정 <b>' + s.확정 + '</b></span><span>고민 <b>' + s.고민 + '</b></span>' + (s.이탈 ? '<span>이탈 <b>' + s.이탈 + '</b></span>' : '') + '<span>2지망 <b>' + s.이지망 + '</b></span></div>' +
      '<div class="kv" style="margin-top:4px"><span>지원요청 <b>' + s.지원요청 + '</b></span><span>지원대기 <b>' + s.지원대기 + '</b></span><span>지원확정 <b>' + s.지원확정 + '</b></span></div>' + (SELDEPT === s.계열 ? '<div class="pick">▼ 아래에 지원 학생 목록</div>' : '') + '</div>';
  });
  return h + '</div>' + statusTable() + '<p style="color:var(--mu);font-size:12px">1지망 기준 · 타교지원·포기 제외 · 순위는 내신(석차백분율)이 낮을수록 상위</p>';
}
function pickDept(d) { SELDEPT = d; render(); }
function statusTable() {
  var sum = D.summary.filter(function (x) { return x.전형 === TRK && x.계열 === SELDEPT; })[0] || { 정원: 0 };
  if (D.me.role === '열람') return '<div class="card stbl"><div class="empty">열람 권한은 학생 목록을 볼 수 없습니다.</div></div>';
  var all = D.rows.filter(function (r) { return r.전형 === TRK; });
  var n1 = all.filter(function (r) { return r['1지망'] === SELDEPT; }).length;
  var n2 = all.filter(function (r) { return r['2지망'] === SELDEPT; }).length;
  var rows = all.filter(function (r) { return r[VIEW2 ? '2지망' : '1지망'] === SELDEPT; }).sort(function (a, b) {
    var x = a.순위 === '' ? 9999 : a.순위, y = b.순위 === '' ? 9999 : b.순위;
    if (x !== y) return x - y;
    var p = a.내신 === '' || a.내신 == null ? 9999 : Number(a.내신), q = b.내신 === '' || b.내신 == null ? 9999 : Number(b.내신);
    return p - q;
  });
  var h = '<div class="card stbl"><h3><span>' + esc(TRK) + ' · ' + esc(SELDEPT) + ' 지원 학생 <span class="tag pr">' + rows.length + '명</span></span>' +
    '<span class="chips"><button class="' + (VIEW2 ? '' : 'on') + '" onclick="VIEW2=false;render()">1지망 ' + n1 + '</button>' +
    '<button class="' + (VIEW2 ? 'on' : '') + '" onclick="VIEW2=true;render()">2지망 ' + n2 + '</button></span></h3>';
  if (!rows.length) return h + '<div class="empty">아직 지원한 학생이 없습니다.</div></div>';

    var out = r.순위 && cap && r.순위 > cap;
    h += '<div class="card' + (r.단계 === '이탈' ? ' gone' : '') + '" style="padding:10px 14px"><div class="row" style="border:0;padding:0"><div class="t"><div>' +
      (admin ? '<input type="checkbox" style="width:auto;margin-right:8px" ' + (SEL[r.ID] ? 'checked' : '') + ' onchange="SEL[\'' + r.ID + '\']=this.checked">' : '') +
      (r.순위 ? '<b>' + r.순위 + '위</b> ' : '') + (r.full ? '<b>' + esc(r.이름) + '</b> ' : '') + '<span style="color:var(--mu)">' + esc(r.중학교) + '</span>' +
      (LDEPT === '전체' ? ' <span class="tag pr">' + esc(r['1지망']) + '</span>' : '') + '</div><div>' +
      (out ? '<span class="tag er">정원 밖</span> ' : '') + stageTag(r.단계) + ' ' + adjTag(r.조정상태) + '</div></div>' +
      '<div class="s">내신 ' + esc(r.내신 === '' || r.내신 == null ? '-' : r.내신) + (r['2지망'] ? ' · 2지망 ' + esc(r['2지망']) : '') + ' · 담당 ' + esc(r.담당교사) +
      '</div>';
    if (r.full) {
      h += '<div class="s">학생 ' + tel(r.학생연락처) + (r.보호자연락처 ? ' · 보호자 ' + tel(r.보호자연락처) : '') +
        '</div><div class="s">담임 ' + esc(r.담임성함) + ' ' + (r.담임연락처 ? tel(r.담임연락처) : '') + '</div>' +
        (r.메모 ? '<div class="s">메모: ' + esc(r.메모) + '</div>' : '') + (r.관리자메모 ? '<div class="s">관리자: ' + esc(r.관리자메모) + '</div>' : '');
    }
    if (r.mine || admin) h += '<div style="margin-top:8px;display:flex;gap:6px"><button class="btn s" onclick="edit(\'' + r.ID + '\')">수정</button><button class="btn s g" onclick="del(\'' + r.ID + '\')">삭제</button></div>';
    h += '</div></div>';
  });
  return h + (rows.length ? '' : '<div class="card">표시할 학생이 없습니다.</div>');
}
function edit(id) {
  var r = D.rows.filter(function (x) { return x.ID === id; })[0];
  FORM = { 전형: r.전형, 중학교: r.중학교, 이름: r.이름, 학생연락처: r.학생연락처, 보호자연락처: r.보호자연락처, 담임성함: r.담임성함, 담임연락처: r.담임연락처,
    내신: r.내신, '1지망': r['1지망'], '2지망': r['2지망'], 메모: r.메모, 단계: r.단계 };
  EDIT = id; TAB = 'form'; render(); scrollTo(0, 0);
}
function del(id) {
  if (!confirm('이 학생 기록을 삭제할까요?')) return;
  busy('삭제 중입니다…');
  call('removeStudent', id).then(function () { toast('삭제했습니다.'); return load(); }).then(idle, function (e) { idle(); toast(e.message || e); });
}
function applyAdj() {
  var ids = Object.keys(SEL).filter(function (k) { return SEL[k]; });
  if (!ids.length) return toast('학생을 먼저 체크하세요.');
  busy('적용 중입니다…');
  call('setAdjust', ids, $('adj').value, $('amemo').value).then(function (r) { SEL = {}; toast(r.count + '명 적용'); return load(); }).then(idle, function (e) { idle(); toast(e.message || e); });
}

FORM = { 단계: '' };
load();
</script>
</body>
</html>
